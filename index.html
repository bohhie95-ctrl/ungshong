  /* 재료 텍스트 → 항목 목록 ( , 와 / 기준으로 나누고 '양념(...)' 같은 묶음은 라벨로 남긴다 )
     '/'는 앞뒤에 공백이 있는 경우만 구분자로 본다 — '1/2공기' 같은 분수를 깨지 않기 위해서. */
  function ingGroups(text){
    var groups = [];
    if(!text) return groups;
    if(text.indexOf('\n') >= 0){
      var lines = text.split('\n').map(function(l){ return l.trim(); }).filter(Boolean);
      if(lines.length) groups.push({label:'', items:lines});
      return groups;
    }
    text.split(/\s+\/\s+/).forEach(function(g){
      g = g.trim(); if(!g) return;
      var m = g.match(/^([가-힣·]{1,7})\((.+)\)$/);
      if(m && (m[2].indexOf(',') >= 0 || m[2].length > 8)){
        groups.push({label:m[1], items:m[2].split(',').map(function(s){return s.trim();}).filter(Boolean)});
      } else {
        groups.push({label:'', items:g.split(',').map(function(s){return s.trim();}).filter(Boolean)});
      }
    });
    return groups;
  }

  function ingHTML(n){
    var e = BY[n]; if(!e) return '';
    var groups = ingGroups(e.ing);
    if(!groups.length) return '';
    var st = INGCHK[String(n)] || {};
    var total = 0, done = 0;
    groups.forEach(function(g){ total += g.items.length; });
    var body = '', idx = 0;
    groups.forEach(function(g){
      if(g.label) body += '<div class="glabel">'+esc(g.label)+'</div>';
      body += '<ul class="ings chk">';
      g.items.forEach(function(it){
        var on = !!st[idx];
        if(on) done++;
        body += '<li class="ck'+(on?' done':'')+'" data-i="'+idx+'">'+
          '<button class="ckbox" type="button" aria-pressed="'+(on?'true':'false')+'" aria-label="재료 체크">'+(on?'☑':'☐')+'</button>'+
          '<span class="cktx">'+md(it)+'</span></li>';
        idx++;
      });
      body += '</ul>';
    });
    return '<div class="chkhdr"><span class="chkprogress" id="ingprog">'+
      (done ? '체크 <b>'+done+'</b>/'+total : '재료 '+total+'개')+
      '</span><button class="chkcopy" type="button" id="ingcopy">🛒 없는 재료 복사</button>'+
      '<button class="chkreset" type="button" id="ingreset">체크 초기화</button></div>'+body;
  }

  function ingProgress(){
    var body = document.getElementById('ingbody'); if(!body) return;
    var all = body.querySelectorAll('li.ck').length;
    var done = body.querySelectorAll('li.ck.done').length;
    var p = document.getElementById('ingprog');
    if(p) p.innerHTML = done ? '체크 <b>'+done+'</b>/'+all : '재료 '+all+'개';
  }

  function toggleIng(box){
    var li = box.parentNode;
    var i = li.getAttribute('data-i');
    var key = String(sheetN);
    var st = INGCHK[key] || (INGCHK[key] = {});
    var on = !st[i];
    if(on) st[i] = 1; else delete st[i];
    if(!Object.keys(st).length) delete INGCHK[key];
    LS.set('ungshong_ing_checks', INGCHK);
    li.classList.toggle('done', on);
    box.textContent = on ? '☑' : '☐';
    box.setAttribute('aria-pressed', on ? 'true' : 'false');
    ingProgress();
  }

  function openSheet(n, push){
    var e = BY[n]; if(!e) return;
    sheetN = n;
    var f = isFav(e.n);
    var h = '';
    h += '<div class="pimg'+(e.wide?' wide':'')+'">';
    h += '<img src="'+imgSrc(e.n)+'" alt="'+esc(e.t)+'" loading="lazy" decoding="async" '+
         'onerror="this.style.visibility=\'hidden\'">';
    h += '<div class="fade"></div></div>';
    h += '<button class="close" id="cbtn" aria-label="닫기">✕</button>';
    h += '<div class="phead"><div class="pnum">RECIPE '+String(e.n).padStart(3,'0')+'</div>'+
         '<div class="ptitlerow"><div class="ptitle">'+esc(e.t)+'</div>'+
         '<button class="favgbtn'+(f?' on':'')+'" type="button" data-fav="'+e.n+'" aria-pressed="'+(f?'true':'false')+'">'+(f?'♥ 찜했어요':'♡ 찜')+'</button></div>'+
         '<div class="pchips">'+
         '<span class="pchip">'+esc(e.c)+'</span>'+
         (e.v?'<span class="pchip warn">▶ 영상 확인 필요</span>':'<span class="pchip">계량·순서 정리됨</span>')+
         '</div>'+
         '<div class="wakeline"><span class="wtxt"><span>📱 요리 중 화면 꺼짐 방지</span>'+
         '<span class="wsup" id="wakestate">'+(wakeSupported()?'꺼짐':'이 브라우저는 지원하지 않아요')+'</span></span>'+
         '<button class="sw'+(wakeSupported()?'':' dim')+'" id="wakebtn" type="button" aria-pressed="false" aria-label="화면 꺼짐 방지"><i></i></button></div>'+
         '</div>';

    if(e.v){
      h += '<div class="notice"><b>영상에서 확인이 필요한 부분이 있어요.</b> 아래 재료·순서 중 '+
           '일부는 원본 릴스에서 확인해야 합니다. 맨 아래 버튼으로 원본을 열어 보세요.</div>';
    }

    if(e.ing)
      h += '<div class="sec"><div class="sech">재료<span class="k">'+e.ic+'가지</span></div>'+
           '<div id="ingbody">'+ingHTML(e.n)+'</div></div>';

    e.x.forEach(function(x){
      h += '<div class="sec"><div class="sech">'+esc(x.l)+'</div>';
      var items = null;
      if(x.v.indexOf('\n') >= 0) items = x.v.split('\n');
      else if(x.v.indexOf(',') >= 0 || x.v.length > 40) items = x.v.split(',');
      if(items){
        h += '<ul class="ings">'+items.map(function(s){return s.trim();}).filter(Boolean).map(function(i){return '<li>'+md(i)+'</li>';}).join('')+'</ul>';
      } else {
        h += '<div class="pin">'+md(x.v)+'</div>';
      }
      h += '</div>';
    });

    h += '<div class="sec"><div class="sech">조리 순서'+(e.s.length?'<span class="k">'+e.s.length+'단계</span>':'')+'</div>';
    if(e.s.length){
      h += '<ol class="steps">';
      e.s.forEach(function(s){
        h += '<li>'+md(s.t);
        s.sub.forEach(function(sub){ h += '<div class="snote">'+md(sub)+'</div>'; });
        h += '</li>';
      });
      h += '</ol>';
    } else if(e.in){
      h += '<div class="pin">'+md(e.in)+'</div>';
    } else {
      h += '<div class="pin">이 게시물은 조리 과정이 영상에만 있어요. 원본 릴스를 확인해 주세요.</div>';
    }
    if(e.sn) h += '<div class="snote" style="margin-top:10px">'+md(e.sn)+'</div>';
    h += '</div>';

    if(e.m) h += '<div class="sec"><div class="sech">메모</div><div class="memo"><p>'+md(e.m)+'</p></div></div>';

    h += '<div class="sec"><div class="sech">⏱️ 요리 타이머<span class="k" id="rtstat">대기</span></div>' +
         '<div class="rtimer" id="rtimer"><span class="tdisp" id="rtdisp">00:00</span>' +
         '<div class="tbtns">' +
         '<button class="tb" type="button" data-tm="60">1분</button>' +
         '<button class="tb" type="button" data-tm="180">3분</button>' +
         '<button class="tb" type="button" data-tm="300">5분</button>' +
         '<button class="tb" type="button" data-tm="600">10분</button>' +
         '<button class="tb" type="button" data-tm="add60">+1분</button>' +
         '<button class="tb go" type="button" data-tm="toggle" id="rttog">▶ 시작</button>' +
         '<button class="tb" type="button" data-tm="reset">초기화</button>' +
         '</div></div></div>';
    if(UNGC.enabled()){
      h += '<div class="sec"><div class="sech">💬 만들어봤어요<span class="k" id="rcmh">'+UNGC.count('r_'+e.n)+'개</span></div>'+
           UNGC.sectionHTML('r_'+e.n)+'</div>';
    }

    h += '<div class="sec"><a class="cta" href="'+esc(e.u)+'" target="_blank" rel="noopener">'+
         '<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"></rect><circle cx="12" cy="12" r="4"></circle><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"></circle></svg>'+
         '인스타그램에서 보기 · @'+esc(e.by)+'</a></div>';
    h += '<div class="pend"></div>';

    panel.innerHTML = h;
    panel.scrollTop = 0;
    lockScroll();
    sheet.classList.add('on');
    opened = true;
    document.getElementById('cbtn').addEventListener('click', function(){ closeSheet(); });
    UNGC.hydrate(panel);
    if(push){
      try { history.pushState({n:n}, '', '#r'+n); pushed = true; } catch(err){}
    }
  }

  // 장소 후기 시트 (카드의 💬 후기 버튼)
  function openComments(itemId, title, sub){
    if(!UNGC.enabled()) return;
    var h = '<button class="close" id="cbtn" aria-label="닫기">✕</button>';
    h += '<div class="chead2"><div class="pnum">PLACE REVIEW</div>' +
         '<div class="ptitle">'+esc(title||'후기')+'</div>' +
         (sub?'<div class="pm">'+esc(sub)+'</div>':'') + '</div>';
    h += '<div class="sec">'+UNGC.sectionHTML(itemId)+'</div>';
    h += '<div class="pend"></div>';
    panel.innerHTML = h;
    panel.scrollTop = 0;
    lockScroll();
    sheet.classList.add('on');
    opened = true;
    document.getElementById('cbtn').addEventListener('click', function(){ closeSheet(); });
    UNGC.hydrate(panel);
    try { history.pushState({c:itemId}, '', '#c'+itemId); pushed = true; } catch(err){}
  }

  function closeSheet(fromPop){
    if(!opened) return;
    if(WAKE.on) wakeOff();
    panel.style.transform = '';
    sheet.classList.remove('on');
    unlockScroll();
    opened = false;
    if(!fromPop && pushed){
      pushed = false;
      try { history.back(); } catch(err){}
    }
  }

  grid.addEventListener('click', function(ev){
    var fb = ev.target.closest ? ev.target.closest('.favbtn') : null;
    if(fb){ ev.preventDefault(); ev.stopPropagation(); toggleFav(fb.getAttribute('data-fav')); return; }
    var card = ev.target.closest('.card'); if(!card) return;
    openSheet(card.getAttribute('data-n'), true);
  });

  // 시트 안: 찜 버튼 · 재료 체크 · 체크 초기화
  panel.addEventListener('click', function(ev){
    var el = ev.target;
    var fb = el.closest ? el.closest('.favgbtn') : null;
    if(fb){ ev.preventDefault(); toggleFav(fb.getAttribute('data-fav')); return; }
    var box = el.closest ? el.closest('.ckbox') : null;
    if(box){ ev.preventDefault(); toggleIng(box); return; }
    var wk = el.closest ? el.closest('#wakebtn') : null;
    if(wk){
      ev.preventDefault();
      if(!wakeSupported()){ toast('이 브라우저는 화면 꺼짐 방지를 지원하지 않아요'); return; }
      if(WAKE.on) wakeOff(); else wakeOn();
      return;
    }
    var ic = el.closest ? el.closest('#ingcopy') : null;
    if(ic){ ev.preventDefault(); copyMissingIngredients(); return; }
    var rs = el.closest ? el.closest('#ingreset') : null;
    if(rs){
      ev.preventDefault();
      delete INGCHK[String(sheetN)];
      LS.set('ungshong_ing_checks', INGCHK);
      var body = document.getElementById('ingbody');
      if(body) body.innerHTML = ingHTML(sheetN);
      return;
    }
  });

  document.getElementById('scrim').addEventListener('click', function(){ closeSheet(); });
  window.addEventListener('popstate', function(){ if(opened) closeSheet(true); });
  document.addEventListener('keydown', function(ev){ if(ev.key === 'Escape') closeSheet(); });

  // swipe-down to close (panel top area only)
  var ty = 0, dragging = false;
  panel.addEventListener('touchstart', function(ev){
    if(panel.scrollTop > 4) return;
    ty = ev.touches[0].clientY; dragging = true;
  }, {passive:true});
  panel.addEventListener('touchmove', function(ev){
    if(!dragging) return;
    var dy = ev.touches[0].clientY - ty;
    if(dy > 0){ panel.style.transform = 'translateY('+dy+'px)'; panel.style.transition = 'none'; }
  }, {passive:true});
  panel.addEventListener('touchend', function(ev){
    if(!dragging) return;
    dragging = false;
    var dy = (ev.changedTouches[0].clientY - ty);
    panel.style.transition = '';
    if(dy > 110){ panel.style.transform = ''; closeSheet(); }
    else { panel.style.transform = ''; }
  });


  /* ---------- 🎲 오늘 어디 가지? ---------- */
  function filteredPlaceRows(){
    var toks = qTokens(), rk = state.region || 'all', out = [];
    PL.forEach(function(sec){
      if (sec.k !== 'place') return;
      sec.p.forEach(function(p){
        if (!pchipsMatch(p)) return;
        if (!regionMatch(p, rk)) return;
        if (!foodMatch(p, state.food)) return;
        if (toks.length && !placeHasAll(p, sec, toks)) return;
        out.push(p);
      });
    });
    return out;
  }
  function pickRandom(){
    var rows = filteredPlaceRows();
    if (!rows.length) { toast('조건에 맞는 곳이 없어요'); return; }
    var p = rows[Math.floor(Math.random() * rows.length)];
    var h = '<div class="diceh">🎲 오늘 어디 가지?</div>' +
      '<div class="dicename">' + esc(p.name) + '</div>' +
      '<div class="dicemeta">' + esc(regionText(p.region)) +
        (p._lb ? '<span class="mtag">' + esc(p._lb) + '</span>' : '') + '</div>' +
      (p.desc ? '<div class="dicedesc">' + esc(p.desc) + '</div>' : '') +
      metaHTML(p) +
      '<div class="diceacts">' +
        (p.map ? '<a class="cta" href="' + esc(p.map) + '" target="_blank" rel="noopener">🗺️ 지도에서 열기</a>' : '') +
      '</div>' +
      '<div class="diceacts">' +
        '<button class="ptool" type="button" data-again="1">🎲 다시 뽑기</button>' +
        '<button class="ptool" type="button" data-share2="1" data-nm="' + esc(p.name) + '" data-url="' + esc(p.map || p.ig || '') + '">🔗 링크 복사</button>' +
      '</div>' +
      '<div class="dicefoot"><span>지금 조건 ' + rows.length + '곳 중 1곳</span>' +
        '<button class="ptool ghost" type="button" data-close="1">닫기</button></div>';
    openModal(h);
  }
  var diceBtn = document.getElementById('dicebtn');
  if (diceBtn) diceBtn.addEventListener('click', pickRandom);

  /* ---------- 🎲 오늘 뭐 먹지? (레시피 랜덤 뽑기) ---------- */
  var lastDiceN = 0;
  function diceConds(){
    var a = [];
    if(state.cat !== 'all') a.push(state.cat);
    if(state.ings.length) a.push(state.ings.map(function(k){ return INGBY[k] ? INGBY[k].t : k; }).join('+'));
    if(state.stats.length) a.push(state.stats.map(function(k){
      for(var i = 0; i < STATOPTS.length; i++){ if(STATOPTS[i].k === k) return STATOPTS[i].t; }
      return k;
    }).join('+'));
    if(state.fav) a.push('♡ 찜');
    if(norm(state.q)) a.push('“' + state.q + '”');
    if(!a.length) return '';
    return a.join(' · ');
  }
  function pickRecipe(){
    var rows = filtered();
    if(!rows.length){ toast('조건에 맞는 레시피가 없어요'); return; }
    var pool = rows.length > 1 ? rows.filter(function(e){ return e.n !== lastDiceN; }) : rows;
    if(!pool.length) pool = rows;
    var e = pool[Math.floor(Math.random() * pool.length)];
    lastDiceN = e.n;
    var cond = diceConds();
    var pv = preview(e);
    var h = '<div class="diceh">🍚 오늘 뭐 먹지?</div>' +
      '<div class="dicename">' + esc(e.t) + '</div>' +
      '<div class="dicemeta">' + esc(e.c) +
        '<span class="mtag">재료 ' + e.ic + '가지</span>' +
        (e.v ? '<span class="mtag">▶ 영상 확인</span>' : '') + '</div>' +
      (pv ? '<div class="dicedesc">🧺 ' + esc(pv) + '</div>' : '') +
      (e.m ? '<div class="dicedesc">' + esc(String(e.m).slice(0, 80)) + '</div>' : '') +
      '<div class="diceacts">' +
        '<button class="ptool" type="button" data-rg="1">🎲 다시 뽑기</button>' +
        '<button class="ptool pri" type="button" data-ro="' + e.n + '">🍳 레시피 열기</button>' +
      '</div>' +
      '<div class="dicefoot"><span>' + (cond ? esc(cond) + ' · ' : '') + rows.length + '개 중 1개</span>' +
        '<button class="ptool ghost" type="button" data-close="1">닫기</button></div>';
    openModal(h);
  }
  var rdiceBtn = document.getElementById('rdicebtn');
  if (rdiceBtn) rdiceBtn.addEventListener('click', pickRecipe);
  var bkBtn = document.getElementById('bkbtn');
  if (bkBtn) bkBtn.addEventListener('click', openBackup);

  if (mcardEl) mcardEl.addEventListener('click', function(ev){
    var el = ev.target;
    if (el.closest('[data-close]')) { closeModal(); return; }
    if (el.closest('[data-again]')) { pickRandom(); return; }
    if (el.closest('[data-rg]')) { pickRecipe(); return; }
    var roEl = el.closest('[data-ro]');
    if (roEl) { closeModal(); openSheet(+roEl.getAttribute('data-ro'), true); return; }
    var sh = el.closest('[data-share2]');
    if (sh) { copyText(sh.getAttribute('data-nm') + '\n' + sh.getAttribute('data-url'), '🔗 가게 이름·지도 링크를 복사했어요'); return; }
    if (el.closest('[data-bkcopy]')) {
      var t = document.getElementById('bktext');
      copyText(t ? t.value : backupJSON(), '💾 백업을 복사했어요');
      return;
    }
    if (el.closest('[data-bkcode]')) {
      var c = backupCode(), box = document.getElementById('bktext');
      if (box) box.value = c;
      copyText(c, '💾 짧은 백업 코드를 복사했어요');
      return;
    }
    if (el.closest('[data-bkrestore]')) {
      var box2 = document.getElementById('bktext');
      var o = parseBackup(box2 ? box2.value : '');
      if (!o) { toast('백업 코드를 읽을 수 없어요'); return; }
      var n = applyBackup(o);
      renderFavPill(); renderPChips(); renderRChips();
      if (state.view === 'place') renderPlaces(); else renderGrid();
      toast(n ? '복원했어요 (' + n + '개 항목)' : '이미 다 들어 있어요');
      openBackup();
      return;
    }
  });
  if (document.getElementById('mwrap')) {
    document.getElementById('mwrap').addEventListener('click', closeModal);
  }
  document.addEventListener('keydown', function(ev){
    if (ev.key === 'Escape' && modalEl && modalEl.classList.contains('on')) closeModal();
  });

  /* ---------- 바 고정 그림자 ---------- */
  (function(){
    var bar = document.querySelector('.bar');
    if (!bar) return;
    var ticking = false;
    function upd(){
      ticking = false;
      bar.classList.toggle('stuck', (window.scrollY || window.pageYOffset || 0) > 8);
    }
    window.addEventListener('scroll', function(){ if(!ticking){ ticking = true; window.requestAnimationFrame(upd); } }, {passive:true});
    upd();
  })();

  // init
  renderCats(); renderStat(); renderFavPill(); renderIceChips(); renderGrid(); renderRChips(); renderCChips();

  /* ---------------- ⏱️ 상세 화면 미니 타이머 ---------------- */
  var _tmSec = 0, _tmIv = null;
  function _tmFmt(s){
    var m = Math.floor(s / 60), r = s % 60;
    return (m < 10 ? '0' : '') + m + ':' + (r < 10 ? '0' : '') + r;
  }
  function _tmBeep(){
    try{ if(navigator.vibrate) navigator.vibrate([200,100,200]); }catch(e){}
    try{
      var AC = window.AudioContext || window.webkitAudioContext;
      if(!AC) return;
      var ctx = new AC();
      [0, 0.25, 0.5].forEach(function(d){
        var o = ctx.createOscillator(), g = ctx.createGain();
        o.type = 'sine'; o.frequency.value = 880;
        g.gain.setValueAtTime(0.15, ctx.currentTime + d);
        g.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + d + 0.18);
        o.connect(g); g.connect(ctx.destination);
        o.start(ctx.currentTime + d); o.stop(ctx.currentTime + d + 0.18);
      });
    }catch(e){}
  }
  function _tmDraw(msg){
    var d = document.getElementById('rtdisp'), box = document.getElementById('rtimer');
    var st = document.getElementById('rtstat'), tg = document.getElementById('rttog');
    if(d) d.textContent = _tmFmt(_tmSec);
    if(tg) tg.textContent = _tmIv ? '⏸ 일시정지' : '▶ 시작';
    if(st) st.textContent = msg || (_tmIv ? '진행 중' : (_tmSec > 0 ? '일시정지' : '대기'));
    if(box) box.classList.toggle('done', msg === '⏰ 시간 끝!');
  }
  document.addEventListener('click', function(ev){
    var btn = ev.target && ev.target.closest ? ev.target.closest('[data-tm]') : null;
    if(!btn) return;
    var act = btn.getAttribute('data-tm');
    if(act === 'reset'){
      if(_tmIv){ clearInterval(_tmIv); _tmIv = null; }
      _tmSec = 0; _tmDraw('대기'); return;
    }
    if(act === 'toggle'){
      if(_tmIv){ clearInterval(_tmIv); _tmIv = null; _tmDraw(); return; }
      if(_tmSec <= 0) return;
      _tmIv = setInterval(function(){
        if(_tmSec > 0) _tmSec--;
        if(_tmSec <= 0){
          clearInterval(_tmIv); _tmIv = null;
          _tmDraw('⏰ 시간 끝!'); _tmBeep();
        }else{ _tmDraw(); }
      }, 1000);
      _tmDraw(); return;
    }
    if(act === 'add60'){ _tmSec += 60; _tmDraw(); return; }
    var v = parseInt(act, 10);
    if(v > 0){
      if(_tmIv){ clearInterval(_tmIv); _tmIv = null; }
      _tmSec = v; _tmDraw();
    }
  });

  if(UNGC.enabled()) UNGC.load(function(){ UNGC.refreshCounts(); });
})();
