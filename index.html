<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>다정집</title>
<meta name="theme-color" content="#FAF6F1">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="다정집">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="brand_dajeongjip/dajeongjip-icon-180.png">
<link rel="icon" type="image/png" href="brand_dajeongjip/dajeongjip-favicon.png">
<link rel="manifest" href="brand_dajeongjip/manifest.json">
<meta name="description" content="다같이 정한 음식·맛집, 우리가 같이 모은 요리 레시피와 가볼 곳을 폰에서 바로 보는 다정집">
<meta property="og:type" content="website">
<meta property="og:title" content="다정집">
<meta property="og:description" content="다같이 정한 음식 · 맛집">
<meta property="og:image" content="https://bohhie95-ctrl.github.io/ungshong/brand_dajeongjip/dajeongjip-icon-512.png">
<meta property="og:image:width" content="512">
<meta property="og:image:height" content="512">
<meta property="og:url" content="https://bohhie95-ctrl.github.io/ungshong/">
<style>
:root{
  --bg:#FAF6F1; --card:#FFFFFF; --ink:#221C18; --muted:#8B7F75; --line:#EDE3D9;
  --accent:#E1542E; --accent-d:#B8431F; --soft:#FFF1EA; --gold:#C08A2E;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);line-height:1.5;word-break:keep-all;overflow-wrap:break-word;
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Malgun Gothic",system-ui,sans-serif;
  -webkit-text-size-adjust:100%;text-rendering:optimizeLegibility}
body.lock{overflow:hidden;position:fixed;width:100%}
button,input{font-family:inherit}
img{display:block}

/* ---------- hero ---------- */
.hero{padding:calc(env(safe-area-inset-top) + 22px) 18px 14px;
  background:radial-gradient(120% 90% at 15% 0%,#FFF3E7 0%,#FBF6F0 55%,#FAF6F1 100%)}
.kicker{font-size:11.5px;letter-spacing:.1em;font-weight:800;color:var(--accent);text-transform:uppercase}
h1.brand{font-size:27px;font-weight:850;letter-spacing:-.03em;margin:7px 0 7px;line-height:1.2}
h1.brand em{font-style:normal;color:var(--accent)}
.stats{font-size:12.5px;color:var(--muted);letter-spacing:.01em}
.stats b{color:#5C534C;font-weight:700}

/* ---------- sticky controls ---------- */
.bar{position:sticky;top:0;z-index:30;background:rgba(250,246,241,.94);
  -webkit-backdrop-filter:saturate(180%) blur(14px);backdrop-filter:saturate(180%) blur(14px);
  border-bottom:1px solid var(--line);padding:9px 12px 7px}
.sbox{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:0 11px;height:42px;box-shadow:0 1px 2px rgba(34,28,24,.04)}
.sbox svg{flex:0 0 auto;opacity:.45}
#q{flex:1;min-width:0;border:0;outline:0;background:transparent;font-size:16px;color:var(--ink);
  -webkit-appearance:none;appearance:none}
#q::-webkit-search-cancel-button,#q::-webkit-search-decoration{-webkit-appearance:none;display:none}
#q::placeholder{color:#B5A99F}
#qx{display:none;border:0;background:#F1E9E1;color:#7A6F66;width:22px;height:22px;
  border-radius:50%;font-size:12px;line-height:1;align-items:center;justify-content:center;padding:0}
#qx.on{display:flex}
.chips{display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;margin:9px -12px 0;
  padding:0 12px 1px;scroll-behavior:smooth}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:#5C534C;border-radius:999px;
  padding:7px 12px;font-size:13px;font-weight:650;white-space:nowrap;transition:background .15s,color .15s}
.chip .c{opacity:.5;margin-left:3px;font-weight:600;font-size:11.5px}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.chip.on .c{opacity:.62}
.chip.area{color:#4E6B5A;border-color:#D8E9DE;background:#F7FBF8}
.chip.area.on{background:#1F7A4D;border-color:#1F7A4D;color:#fff}
.chip.mk.on{background:var(--accent);border-color:var(--accent);color:#fff}
/* 레시피 찜 필터 (건수줄 가운데pill) */
.favpill{display:inline-flex;align-items:center;gap:3px;border:1px solid var(--line);background:#fff;
  color:#7A6F66;border-radius:999px;padding:5px 9px;font-family:inherit;font-size:11.5px;font-weight:800;
  white-space:nowrap;flex:0 0 auto;margin:0 2px}
.favpill .n{opacity:.55;font-weight:700}
.favpill.on{background:var(--accent);border-color:var(--accent);color:#fff}
.favpill.on .n{opacity:.8}
/* 💬 후기 전체보기 pill — 레시피·가볼 곳 어느 탭에서든 스크롤 없이 바로 보이는 자리 */
.cmbtn{display:inline-flex;align-items:center;gap:3px;border:1px solid #F2C3AE;background:var(--soft);
  color:var(--accent-d);border-radius:999px;padding:5px 10px;font-family:inherit;font-size:11.5px;font-weight:850;
  white-space:nowrap;flex:0 0 auto;margin:0 1px;box-shadow:0 1px 3px rgba(225,84,46,.16)}
.cmbtn .n{font-weight:800;opacity:.85}
.cmbtn.on{background:var(--accent);border-color:var(--accent);color:#fff;box-shadow:0 1px 3px rgba(225,84,46,.3)}
.cmbtn.on .n{color:#fff;opacity:.9}
.cmbtn[hidden]{display:none}
@media(max-width:350px){
  .seg button{padding:5px 6px;font-size:11px}
  .seg button .n{display:none}
  .favpill{padding:5px 7px;font-size:11px;margin:0 1px}
  .cmbtn{padding:5px 7px;font-size:11px;margin:0}
}
.subrow{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;row-gap:4px;padding:7px 1px 1px}
.cnt{font-size:11.5px;color:var(--muted);white-space:nowrap}
.cnt b{color:var(--ink);font-weight:800}
.seg{display:flex;background:#F0E8E0;border-radius:999px;padding:2px;flex:0 0 auto}
.seg button{border:0;background:transparent;font-size:11.5px;font-weight:700;color:#7A6F66;
  padding:5px 8px;border-radius:999px;transition:background .15s,color .15s}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(34,28,24,.1)}
.seg button .n{opacity:.5;font-weight:600}

/* ---------- grid ---------- */
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:11px;padding:13px 12px 104px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;padding:16px 16px 104px}}
@media(min-width:900px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));max-width:1180px;margin:0 auto}}
.card{background:var(--card);border-radius:16px;overflow:hidden;border:1px solid var(--line);
  box-shadow:0 1px 2px rgba(34,28,24,.05);display:flex;flex-direction:column;cursor:pointer;
  transition:transform .12s ease,box-shadow .12s ease}
.card:active{transform:scale(.983);box-shadow:0 0 0 rgba(0,0,0,0)}
.thumb{position:relative;aspect-ratio:1/1;background:#F0E7DE;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;opacity:0;transition:opacity .3s ease;transform:scale(1.001)}
.thumb img.on{opacity:1}
.badge{position:absolute;top:7px;right:7px;background:rgba(26,20,16,.6);color:#fff;font-size:10px;
  font-weight:800;letter-spacing:.02em;padding:3px 7px;border-radius:999px;
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);display:flex;align-items:center;gap:3px}
.badge i{font-style:normal;font-size:8px}
/* 카드 찜 버튼 (썸네일 우하단) */
.favbtn{position:absolute;right:7px;bottom:7px;z-index:3;width:30px;height:30px;border-radius:50%;border:0;
  background:rgba(255,255,255,.93);color:#B4432A;font-size:15px;line-height:1;padding:0;
  display:flex;align-items:center;justify-content:center;box-shadow:0 1px 5px rgba(34,28,24,.22);
  -webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px);touch-action:manipulation}
.favbtn.on{background:var(--accent);color:#fff;box-shadow:0 2px 8px -2px rgba(225,84,46,.65)}
.cb{padding:9px 11px 11px}
.ct{font-size:14px;font-weight:750;line-height:1.36;letter-spacing:-.015em;color:#2A2320;
  display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.cm{margin-top:6px;font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;
  text-overflow:ellipsis;letter-spacing:-.01em}
.cm b{color:#7B6A5C;font-weight:750}

/* ---------- empty ---------- */
.empty{display:none;text-align:center;padding:64px 24px 96px;color:var(--muted)}
.empty.on{display:block}
.empty .e{font-size:34px;margin-bottom:10px}
.empty .t{font-size:15px;font-weight:750;color:#5C534C;margin-bottom:6px}
.empty .s{font-size:13px;line-height:1.6}

/* ---------- sheet ---------- */
.sheet{position:fixed;inset:0;z-index:100;display:none}
.sheet.on{display:block}
.scrim{position:absolute;inset:0;background:rgba(26,20,16,.42);opacity:0;transition:opacity .26s}
.sheet.on .scrim{opacity:1}
.panel{position:absolute;inset:0;background:var(--bg);overflow-y:auto;-webkit-overflow-scrolling:touch;
  transform:translateY(100%);transition:transform .3s cubic-bezier(.22,.9,.24,1);overscroll-behavior:contain}
.sheet.on .panel{transform:translateY(0)}
@media(min-width:700px){
  .panel{inset:auto;left:50%;top:50%;width:640px;max-height:88vh;border-radius:20px;
    transform:translate(-50%,-46%) scale(.97);opacity:0;transition:transform .3s,opacity .3s}
  .sheet.on .panel{transform:translate(-50%,-50%) scale(1);opacity:1}
}
.close{position:absolute;top:calc(env(safe-area-inset-top) + 10px);right:12px;z-index:5;width:36px;height:36px;
  border-radius:50%;border:0;background:rgba(24,18,14,.55);color:#fff;font-size:17px;line-height:1;
  -webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);display:flex;align-items:center;justify-content:center}
.pimg{position:relative;width:100%;height:min(42vh,370px);background:#EFE7DE;overflow:hidden}
.pimg img{width:100%;height:100%;object-fit:cover}
.pimg.wide{height:auto;max-height:min(56vh,520px);background:#fff}
.pimg.wide img{height:auto;max-height:min(56vh,520px);object-fit:contain}
.pimg .fade{position:absolute;left:0;right:0;bottom:0;height:60px;
  background:linear-gradient(to top,rgba(250,246,241,.9),rgba(250,246,241,0))}
.phead{padding:2px 18px 4px;margin-top:-14px;position:relative}
.ptitlerow{display:flex;align-items:flex-start;gap:10px}
.ptitlerow .ptitle{flex:1;min-width:0}
.favgbtn{flex:0 0 auto;display:inline-flex;align-items:center;gap:4px;border:1px solid var(--line);background:#fff;
  color:#B4432A;border-radius:999px;padding:7px 11px;font-family:inherit;font-size:12px;font-weight:800;
  margin-top:8px;white-space:nowrap;touch-action:manipulation}
.favgbtn.on{background:var(--accent);border-color:var(--accent);color:#fff}
.pnum{font-size:11px;font-weight:800;letter-spacing:.1em;color:var(--accent)}
.ptitle{font-size:22px;font-weight:850;letter-spacing:-.025em;line-height:1.28;margin:5px 0 9px;color:#1F1916}
.pchips{display:flex;gap:6px;flex-wrap:wrap;padding-bottom:2px}
.pchip{font-size:11.5px;font-weight:750;padding:4px 9px;border-radius:999px;background:#fff;
  border:1px solid var(--line);color:#6E635A}
.pchip.warn{background:var(--soft);border-color:#F6CDBC;color:#BF4620}
.notice{margin:12px 18px 0;background:#FFF6F1;border:1px solid #F7D6C7;border-radius:12px;
  padding:10px 12px;font-size:12.5px;line-height:1.55;color:#9C4A2A}
.notice b{color:#B8431F}
.sec{padding:16px 18px 0}
.sech{font-size:13.5px;font-weight:800;letter-spacing:-.01em;margin:0 0 8px;display:flex;align-items:center;gap:7px}
.sech::before{content:"";width:4px;height:13px;border-radius:2px;background:var(--accent);flex:0 0 auto}
.sech .k{color:var(--muted);font-weight:700;font-size:12px;margin-left:auto}
.ings{list-style:none;margin:0 0 8px;padding:0;background:#fff;border:1px solid var(--line);
  border-radius:14px;overflow:hidden}
.sec .ings:last-child{margin-bottom:0}
.ings li{padding:7px 13px;font-size:13.8px;line-height:1.45;border-bottom:1px solid #F4EDE6;
  display:flex;gap:7px;color:#3A322C}
.ings li:last-child{border-bottom:0}
.ings li::before{content:"·";color:var(--accent);font-weight:900;flex:0 0 auto}
.glabel{font-size:11.5px;font-weight:800;color:var(--accent-d);margin:12px 0 6px;letter-spacing:.02em}
.glabel:first-child{margin-top:0}
/* 재료 체크리스트 */
.chkhdr{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 7px}
.chkprogress{font-size:11.5px;font-weight:800;color:var(--accent-d);letter-spacing:-.01em}
.chkprogress b{color:var(--accent)}
.chkreset{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 9px;
  font-family:inherit;font-size:11px;font-weight:800;color:#7A6F66;touch-action:manipulation}
.chkreset:active{background:#F6EFE8}
.ings.chk li{padding:0;display:block}
.ings.chk li::before{content:none}
.ings.chk li.ck{display:flex;align-items:flex-start;gap:2px;transition:background .12s}
.ckbox{flex:0 0 auto;border:0;background:transparent;color:#B4432A;font-size:15px;line-height:1.35;
  width:26px;padding:6px 0 6px 12px;text-align:left;font-family:inherit;touch-action:manipulation}
.cktx{flex:1;min-width:0;padding:7px 13px 7px 3px;font-size:13.8px;line-height:1.45;color:#3A322C}
.ings.chk li.ck.done{background:#FAF7F3}
.ings.chk li.ck.done .cktx{text-decoration:line-through;color:#B4A99E}
.ings.chk li.ck.done .ckbox{color:#9C8F84}
.steps{list-style:none;margin:0;padding:0;counter-reset:s}
.steps>li{position:relative;padding:0 0 15px 33px;counter-increment:s;font-size:14.5px;line-height:1.62;color:#2E2722}
.steps>li::before{content:counter(s);position:absolute;left:0;top:1px;width:22px;height:22px;border-radius:50%;
  background:var(--soft);border:1px solid #F6D2C2;color:var(--accent-d);font-size:11.5px;font-weight:800;
  display:flex;align-items:center;justify-content:center;letter-spacing:0}
.snote{margin-top:6px;font-size:12px;line-height:1.55;color:#95705A;background:#FFF8F3;
  border-left:2px solid #F2C6B2;padding:6px 9px;border-radius:0 8px 8px 0;font-weight:500}
.pin{font-size:15px;line-height:1.7;color:#2E2722;background:#fff;border:1px solid var(--line);
  border-radius:14px;padding:12px 14px}
.memo{background:#FFF8EA;border:1px solid #F1E1C4;border-radius:12px;padding:11px 13px;
  font-size:13px;line-height:1.62;color:#6A5942}
.memo p{margin:0}
.cta{display:flex;align-items:center;justify-content:center;gap:8px;margin:18px 0 0;
  background:linear-gradient(135deg,#F06A41,#D94820);color:#fff;text-decoration:none;font-weight:800;
  font-size:14.5px;padding:14px;border-radius:14px;box-shadow:0 6px 16px -8px rgba(217,72,32,.7)}
.cta svg{opacity:.9}
.pend{height:calc(env(safe-area-inset-bottom) + 26px)}
strong{font-weight:800;color:#1F1916}
code{background:#F3ECE5;border-radius:5px;padding:1px 5px;font-size:.92em;white-space:nowrap;
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:#8A4B2E}

/* ---------- places ---------- */
.places{padding:0 0 104px}
.pintro{margin:14px 14px 0;background:linear-gradient(135deg,#EFF7F2,#F7FBF8);border:1px solid #D8E9DE;
  border-radius:16px;padding:14px 15px}
.pintro h2{font-size:15px;margin:0 0 6px;letter-spacing:-.01em}
.pintro p{margin:0;font-size:12.5px;line-height:1.6;color:#5A6B61}
.pintro p.pnote{margin-top:7px;font-size:11.5px;line-height:1.6;color:#7C8D82}
.pintro p.pnote b{color:#4E6B5A}
.psec{padding:14px 14px 0}
/* 카테고리 아코디언: 헤더를 누르면 접었다 펴진다 (기본 접힘) */
.psec .phead{width:100%;display:flex;align-items:center;gap:7px;background:#fff;border:1px solid var(--line);
  border-radius:12px;padding:12px 13px;font-family:inherit;font-size:13.5px;font-weight:800;color:#5C534C;
  text-align:left;letter-spacing:-.01em;touch-action:manipulation;-webkit-tap-highlight-color:rgba(31,122,77,.14);
  transition:background .12s}
.psec .phead:active{background:#F1F8F4}
.psec .phead .n{color:#A2968B;font-weight:700;font-size:11.5px}
.psec .phead .tg{margin-left:auto;font-size:11px;line-height:1;color:#B4A99E;transition:transform .18s,color .18s}
.psec.open .phead{background:#F7FBF8;border-color:#D8E9DE;color:#2C5C43}
.psec.open .phead .tg{transform:rotate(90deg);color:#1F7A4D}
.psec .pbody{padding-top:9px}
.psec:not(.open) .pbody{display:none}
/* 장소 카드 전체가 하나의 링크 — 작은 버튼만 눌리던 문제 해결 */
.prow{background:#fff;border:1px solid var(--line);border-radius:14px;margin-bottom:8px;overflow:hidden}
.pmain{display:block;padding:13px 14px 12px;text-decoration:none;color:inherit;min-height:56px;
  touch-action:manipulation;-webkit-tap-highlight-color:rgba(31,122,77,.14);transition:background .12s}
.pmain:active{background:#EFF7F2}
.pmain.plain{touch-action:auto;-webkit-tap-highlight-color:transparent}
.pmain.plain:active{background:#fff}
.pn{font-size:15.5px;font-weight:750;letter-spacing:-.015em;color:#26201C}
.pm{font-size:11.5px;color:var(--muted);margin-top:2px}
/* 주력 메뉴·음식 종류 배지 */
.mtag{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:800;color:#B8431F;
  background:var(--soft);border:1px solid #F6CDBC;border-radius:6px;padding:1px 6px;
  vertical-align:1px;letter-spacing:-.01em;white-space:nowrap}
.pd{font-size:12.5px;color:#6B5F55;margin-top:5px;line-height:1.55}
/* 영업시간·주차·애견동반 배지 */
.pmeta{display:flex;flex-wrap:wrap;gap:4px;margin-top:7px}
.bdg{display:inline-flex;align-items:center;gap:3px;font-size:11px;font-weight:700;line-height:1.25;
  padding:3px 7px;border-radius:7px;background:#F7F4F0;border:1px solid #E9E2DA;color:#6B5F55;
  white-space:nowrap;letter-spacing:-.01em}
.bdg.on{background:#EAF6EF;border-color:#CFE9D9;color:#1F7A4D}
.bdg.off{background:#FDF0F0;border-color:#F3D6D6;color:#A9524F}
.bdg.q{background:#FAF7EE;border-color:#EBE3CD;color:#8A7A4E;font-weight:650}
.bdg .lb{font-weight:800;opacity:.9}
.bdg.h{white-space:normal}
.pgo{display:inline-flex;align-items:center;gap:4px;margin-top:9px;font-size:12px;font-weight:800;
  color:#1F7A4D;background:#EAF6EF;border:1px solid #CFE9D9;border-radius:9px;padding:6px 10px}
.pgo .ar{font-size:14px;line-height:1;opacity:.7}
.pmain .pgo.ig{color:#B03A63;background:#FDF0F4;border-color:#F6D3E0}
.pl{display:flex;gap:6px;padding:0 12px 12px;flex-wrap:wrap}
.pl a{font-size:12px;font-weight:750;text-decoration:none;padding:8px 11px;border-radius:9px;
  border:1px solid #F6D3E0;color:#B03A63;background:#FDF0F4;touch-action:manipulation}

/* ---------- 찜 / 다녀옴 ---------- */
.pfoot{display:flex;align-items:center;gap:6px;padding:0 12px 11px;margin-top:-2px}
.pfoot .sp{flex:1;min-width:0}
.mbtn{display:inline-flex;align-items:center;gap:4px;font-family:inherit;font-size:11.5px;font-weight:800;
  color:#6E5A4A;background:#fff;border:1px solid #E7DCCF;border-radius:999px;padding:6px 10px;
  cursor:pointer;white-space:nowrap;touch-action:manipulation;
  -webkit-tap-highlight-color:rgba(225,84,46,.12);transition:background .12s,color .12s,border-color .12s}
.mbtn:active{background:#FBF3EA}

/* ---------- 🟢 영업중 조건 칩 ---------- */

/* --- 토스트 --- */
.toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 74px);transform:translate(-50%,12px);
  max-width:86vw;padding:9px 14px;border-radius:999px;background:rgba(34,28,24,.94);color:#fff;
  font-size:12.5px;font-weight:750;line-height:1.35;text-align:center;opacity:0;pointer-events:none;
  transition:opacity .2s,transform .2s;z-index:200}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(max-width:360px){.bar .chip{font-size:12px;padding:4px 9px}}

/* ================= v9.5: 🧊 냉장고 털기 · ⚡ 초간단 · 🎲 오늘 뭐 먹지? ================= */
/* 검색줄 + 🎲 오늘 뭐 먹지? (레시피 탭 전용) */
.srow{display:flex;align-items:center;gap:7px}
.srow .sbox{flex:1;min-width:0}
#rtools{flex:0 0 auto}

/* 🧊 냉장고 털기 재료 칩 줄 (가로 1줄 스와이프) */
#rcchips{margin-top:5px}

.bar .seg{flex:1 1 100%;min-width:0;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;
  -webkit-overflow-scrolling:touch;white-space:nowrap}
.bar .seg::-webkit-scrollbar{display:none}

.rcmb.has{display:inline-flex}
.icebtn{display:inline-flex;align-items:center;gap:4px;padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:var(--card);color:var(--muted);font:inherit;font-size:12px;font-weight:700;cursor:pointer;white-space:nowrap;flex:0 0 auto}.icebtn.on{border-color:var(--accent);background:#fff3ec;color:var(--accent)}.rtimer{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:10px 12px;border-radius:12px;background:#fff8f3;border:1px solid #f0ded3;margin-top:4px}.rtimer .tdisp{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--ink);letter-spacing:.5px}.rtimer.done .tdisp{color:var(--accent)}.rtimer .tbtns{display:flex;flex-wrap:wrap;gap:5px}.rtimer .tb{padding:5px 9px;border-radius:999px;border:1px solid var(--line);background:#fff;color:var(--ink);font:inherit;font-size:11.5px;font-weight:700;cursor:pointer}.rtimer .tb.go{background:var(--accent);border-color:var(--accent);color:#fff}</style>

액·맛술 1T씩, 물은 계란과 동량으로 넣고 찜기에서 15분 찐다.","sub":[]},{"t":"**계란볶이** — 물 200ml, 고추장 1T, 고춧가루 1T, 맛술 1T, 설탕 1.5T, 간장 1T, 굴소스 1T, 다진마늘 1T로 소스를 만들고 계란을 넣어 센불에서 졸인다.","sub":[]},{"t":"**어묵탕** — ① 물 1.2L, 코인육수 2알, 무를 넣고 5분 끓인다. ② 백간장 2T(또는 참치액 2+국간장 1/3), 맛술 1T를 넣는다. ③ 끓으면 썰어둔 어묵 3장과 다진마늘 1T를 넣고 3분 끓인다. ④ 콩나물·청양고추를 넣고 1분 더 끓인다. ⑤ 순후추를 뿌린다.","sub":[]}],"in":"","sn":"","m":"땡초장은 김밥·비빔국수·잔치국수 고명·짜파게티 위에 올려도 좋다. 무의 초록 윗부분은 단맛이 좋아 생으로/나물로, 흰 아랫부분은 육수용.","by":"__cookduck","u":"https://www.instagram.com/reel/DLZaTO9OwGa/","v":0},{"n":45,"t":"만원으로 일주일 반찬 (2)","c":"반찬·무침","ing":"계란 10구, 두부 290g, 시금치 200g, 어묵 240g, 느타리버섯 200g + 집에 있는 대파·양파·당근·양념","ic":5,"wide":0,"x":[{"l":"장보기(쿠팡)","v":"계란 10구 3,980원, 두부 290g 1,340원, 시금치 200g 2,100원, 어묵 240g 1,180원, 느타리버섯 200g 1,490원 (합 10,090원) + 집에 있는 대파·양파·당근·양념"}],"s":[{"t":"**계란찜** — ① 대파·양파·당근을 다진다(생략 가능). ② 계란 3개, 계란과 동량의 물, 참치액 1T, 맛술 1T를 섞는다(체에 거르거나 초퍼에 갈면 부드럽다). ③ 물이 끓으면 찜기에 넣고 중불 3분 → 약불 9분. ④ 먹기 전 들기름·참기름을 두른다.","sub":[]},{"t":"**계란장** — ① 계란 5개를 삶아 얼음물에 식힌다. ② 껍질을 까고 간장 120ml, 설탕 60ml, 물 120ml, 다진양파 반 개, 다진고추 1개, 다진 대파 1/2대, 깨와 함께 담근다. ③ 냉장고에서 12시간 숙성한다.","sub":[]},{"t":"**두부조림** — ① 두부는 1/5 정도 남기고 네모나게 썬다. ② 용기에 담고 간장 2T, 고춧가루 2T, 설탕 1t, 다진마늘 1/2T, 다진대파 1T, 물 45ml를 섞어 양념장을 만들어 올린다. ③ 뚜껑을 닫고 전자레인지 5분. ④ 참기름·통깨를 뿌린다.","sub":[]},{"t":"**시금치두부무침** — ① 남긴 두부는 면보에 물기를 꽉 짜 으깬다. ② 시금치는 씻어 전자레인지에 1~2분 돌려 물기를 짠다. ③ 볼에 모두 담고 소금 1t, 다진 파 조금, 마늘 1T, 깨 1T, 후추 조금, 참기름 넉넉히 넣어 무친다.","sub":[]},{"t":"**시금치계란볶음** — ① 식용유를 두르고 시금치를 먹기 좋게 찢어 볶는다. ② 한쪽으로 밀고 계란 2개를 스크램블한다. ③ 굴소스 1~1.5T를 넣어 살짝 볶는다. ④ 불을 끄고 참기름 1T, 통깨를 뿌린다.","sub":[]},{"t":"**어묵볶음** — ① 어묵·대파·당근·양파를 썬다. ② 팬에 식용유 2T를 두르고 다진마늘 1/2T, 대파, 당근, 양파를 볶는다. ③ 간장 2T, 설탕 1T, 고춧가루 2T를 넣고 약불로 볶는다. ④ 물 60~70ml를 넣고 어묵을 볶는다. ⑤ 양념이 배면 불을 끄고 물엿 1T, 참기름 1T, 깨를 넣어 섞는다.","sub":[]},{"t":"**느타리버섯장조림** — 물 100ml, 진간장 65ml, 물엿 65ml, 참기름 1T, 후추, 통깨를 냄비에 넣고 끓인 뒤 버섯을 찢어 넣고 졸인다.","sub":[]}],"in":"","sn":"","m":"같은 재료로 다른 반찬을 만드는 2편.","by":"__cookduck","u":"https://www.instagram.com/reel/DHsRwlnpDtf/","v":0},{"n":46,"t":"메추리알 장조 , 멸치육수, 간장, 미역줄기, 무, 쌀 | 1. 쌀 한 컵을 불린다 2. 명란을 굽는다 3. 남은 버터를 솥에 넣어 불린 쌀이 투명해지도록 볶는다 4. 육수 200ml + 어간장 0.5스푼을 넣어 센불에 볶는다 5. 끓으면 미역줄기·무·구운 명란을 넣고 10분 뜸 들인다 6. 남은 버터를 넣어 비벼 먹는다"},{"l":"전현무 오이샌드위치","v":"재료: 오이, 명란, 크림치즈, 후추, 오일, 식빵 | 1. 오이 반개~1개를 얇게 채 썰어 소금에 살짝 절인다 2. 명란 작은 것 + 크림치즈 두 스푼을 넣어 섞는다 3. 식빵을 구워 크림치즈를 골고루 바른다 4. 위에 오이를 올리고 후추·참기름(오일) 뿌려 먹는다"},{"l":"박나래 홍시 티라미수","v":"재료: 시판 카스테라, 대봉홍시 3~4개, 그릭요거트, 코코아파우더 | 1. 카스테라를 유리컵 밑에 깐다 2. 홍시 씨를 제거하고 갈아준다 3. 카스테라 위에 요거트를 담는다 4. 카스테라→요거트→홍시→요거트→홍시→코코아가루 순으로 마무리한다"},{"l":"박나래 오이명란마요","v":"재료: 오이, 마요네즈, 명란, 참기름, (청양고추) | 1. 중약불에 참기름을 두른 뒤 명란젓을 굽는다 2. 껍질을 깎은 오이를 먹기 좋게 썰어준다 3. 오이와 구운 명란을 마요네즈에 찍어 먹는다 (청양고추 곁들이면 좋음)"},{"l":"키 레몬딜버터","v":"재료: 레몬 1개, 딜 10g, 버터 400g, 종이호일 | 1. 레몬을 깨끗이 씻어 껍질을 갈아준다 (흰 부분 제외) 2. 딜은 굵은 줄기를 빼고 잘게 다진다 3. 실온에 둔 버터와 1·2를 넣고 섞는다 (레몬즙 짜 넣으면 상큼!) 4. 섞은 버터를 종이호일에 싸서 냉동실에 넣는다"},{"l":"박나래 김치말이순두부","v":"재료: 순두부, 오이, 냉면육수, 참기름, 설탕, 맛술, 김치, 김치국물, 김 | 1. 김치에 설탕 반스푼·맛술 반스푼·참기름 반스푼을 넣고 버무린다 2. 채 썬 오이와 국물 제거한 순두부를 냉면육수에 넣는다 3. 버무린 김치와 김치국물, 김가루를 뿌리면 완성"},{"l":"박나래 태극주","v":"재료: 파워에이드, 홍초, 소주 | 1. 컵에 홍초와 소주를 1/3 지점까지 붓는다 2. 파워에이드를 홍초·소주와 섞이지 않도록 조심스레 붓는다 3. 아래는 빨간색, 위는 파란색인 상태로 마신다"},{"l":"우영 꿀호떡버거","v":"재료: 꿀호떡, 떡갈비, 계란, 양상추, 마요네즈, 머스타드 | 1. 꿀호떡을 살짝 구워 속의 꿀을 녹인다 2. 떡갈비를 굽고 계란 후라이를 만든다 3. 꿀호떡-양상추-마요네즈-머스타드-떡갈비-계란-꿀호떡 순으로 쌓으면 완성"},{"l":"박나래 초계국수","v":"재료: 미역국수, 파프리카, 냉면육수, 닭가슴살 | 1. 미역국수를 흐르는 물에 씻는다 2. 살얼음진 냉면육수를 부어준다 3. 파프리카와 닭가슴살을 썰어 올려주면 완성"},{"l":"박나래 어묵라면","v":"재료: 라면 1개, 판어묵, 물, 다진마늘 1/3큰술, 청양고추 | 1. 어묵을 돌돌 말아 면처럼 얇고 길게 썬다 2. 끓는 물에 라면과 다진마늘을 넣어 끓인다 3. 마무리로 청양고추와 어묵을 넣어 끓여주면 완성"},{"l":"화사 간장국수","v":"재료: 소면, 간장 1, 설탕 1, 들기름 2, 계란 노른자 | 1. 소면을 삶아 찬물에 헹군다 2. 간장 1·설탕 1·들기름 2를 섞어 면에 비빈다 3. 계란 노른자 하나를 올리면 완성"},{"l":"키 대파김치","v":"재료: 대파, 고춧가루 1/3컵, 멸치액젓 4, 다진마늘 2/3, 다진생강 1, 매실청 1 | 1. 대파를 깨끗이 씻어 약 2cm 크기로 자른다 2. 양념(고춧가루·멸치액젓·다진마늘·다진생강·매실청)을 모두 잘 섞는다 3. 자른 대파에 양념장을 골고루 버무리면 완성"},{"l":"박나래 복숭아그릭요거트","v":"재료: 복숭아, 그릭요거트, 꿀, 그래놀라 | 1. 복숭아 껍질을 깎고 꼭지 부분을 잘라낸다 2. 꼭지 쪽을 잘라 안의 씨를 파낸다 3. 그릭요거트를 복숭아 속에 채운다 4. 냉동실에 조금 얼린 뒤 그래놀라→복숭아→꿀 순으로 올린다"},{"l":"김지훈 단짠아삭토스트","v":"재료: 식빵, 스팸, 슬라이스치즈, 양배추, 마요네즈, 연유, 후추, 상추 2장, 계란 1개 | 1. 양배추를 썰어 마요네즈·연유를 1:1 비율로 뿌리고 후추를 뿌린다 2. 식빵을 구워 상추와 양배추를 올린다 3. 스팸을 굽다가 그 위에 치즈를 올리고 뚜껑을 닫아 치즈를 녹인다 4. 식빵에 스팸+치즈를 얹는다 5. 반숙 계란후라이를 올리고 식빵으로 덮어 완성"},{"l":"키 순두부열라면","v":"재료: 열라면, 순두부, 대파, 고춧가루, 다진마늘 1/2t, (청양고추, 계란) | 1. 물이 끓기 전 순두부를 넣고 끓인다 2. 물이 끓기 시작하면 면 반 개를 넣고 끓인다 (1인분 기준 면 1/2개 추천) 3. 분말스프·파·다진마늘을 넣고 팔팔 끓인다 4. 기호에 따라 계란·청양고추·후추 약간을 넣고 끓인다"},{"l":"김지훈 피자토스트","v":"재료: 식빵, 토마토소스, 마요네즈, 꿀, 계란, 토핑, 치즈 | 1. 식빵에 토마토소스를 바르고 테두리에 마요네즈를 두른다 2. 중앙에 꿀을 발라준 후 노른자를 터트려 가운데 넣는다 3. 전자레인지에 2분 돌린 후 취향껏 토핑과 치즈를 올려 에어프라이어 180도 10분 돌리면 완성"},{"l":"성훈 짜르보나라","v":"재료: 짜파게티, 우유 3/4컵, 고추참치 1캔 | 1. 면을 삶아 건지고 우유(3/4컵)를 부어 끓인다 2. 짜장라면 스프를 넣고 면이 적당히 익을 때까지 끓인다 3. 마무리로 고추참치를 올려주면 완성"},{"l":"키 기범주","v":"재료: 물 550ml, 홍차 티백(마르코 폴로 티 등), 얼음, 소주 1병 | 1. 물 550ml에 홍차를 우려낸다 (얼그레이·실론티도 가능) 2. 홍차 우린 물과 소주(비율 소주 1 : 홍차 2)·얼음을 섞어 시원해지면 마신다"},{"l":"허훈 맥사토","v":"재료: 맥주, 사이다, 토마토주스 | 1. 컵에 맥주를 붓는다 2. 맥주·사이다·토마토주스를 1:1:1 비율로 부어 잘 섞으면 완성"}],"s":[],"in":"슬라이드 2~8번 25종 전체 정리 완료","sn":"","m":"캐러셀 이미지에 레시피가 정리돼 있음.","by":"play_with_unni","u":"https://www.instagram.com/p/CzP5zv7MxKx/","v":0},{"n":188,"t":"초간단 치즈푸딩 케이크","c":"간식·기타","ing":"노른자 2개, 우유 500ml, 옥수수전분 50g, 체다치즈 2장","ic":4,"wide":0,"x":[],"s":[{"t":"노른자 2개, 우유 500ml, 옥수수전분 50g, 체다치즈 2장을 냄비에 넣고 섞으며 끓인다.","sub":[]},{"t":"걸쭉해지면 용기에 담아 식힌다.","sub":[]},{"t":"용기에 담기 전 식용유를 발라야 깔끔하게 분리된다.","sub":[]}],"in":"","sn":"","m":"4가지 재료. 단맛이 거의 없어 취향껏 설탕을 추가. 상세 순서는 영상 참고.","by":"zihyuncook","u":"https://www.instagram.com/reel/C5S365xRBlN/","v":0},{"n":189,"t":"백종원 간식 레시피 모음","c":"간식·기타","ing":"식빵, 감자, 라면, 떡, 어묵, 소세지, 옥수수, 진미채, 마요네즈","ic":9,"wide":1,"x":[],"s":[{"t":"**진미채튀김** — 재료: 진미채, 튀김가루, 물, 카레가루, 식용유 / ① 진미채는 물에 불려 촉촉하게 만들고 먹기 좋게 자른다. ② 불린 진미채와 카레가루를 봉지에 넣고 잘 흔들어 섞는다. ③ 물과 튀김가루를 넣고 잘 섞고, 팬에 기름을 넉넉히 두른다. ④ 기름이 적당한 온도가 되면 진미채를 넣고 노릇하게 튀긴다.","sub":[]},{"t":"**킹치즈토스트** — 재료: 식빵, 양배추, 양파, 당근, 버터, 계란, 대파, 설탕, 소금, 체다치즈, 달걀, 슬라이스햄 / ① 양파·당근·양배추는 얇게 채 썰고 대파는 잘게 다진다. ② 볼에 달걀을 넣고 설탕·소금으로     }
    return h + '</ul>';
  }

  function formHTML(itemId) {
    var saved = '';
    try { saved = localStorage.getItem('ungshong.nick') || ''; } catch (e) {}
    return '<div class="cform">' +
      '<input class="cnick" type="text" maxlength="' + MAXN + '" autocomplete="nickname" ' +
        'placeholder="닉네임 (기본 익명)" value="' + esc(saved) + '">' +
      '<div class="crow">' +
        '<input class="ctext" type="text" maxlength="' + MAXT + '" autocomplete="off" ' +
          'placeholder="한 줄 후기 (최대 ' + MAXT + '자)">' +
        '<button class="csubmit" type="button">등록</button>' +
      '</div>' +
      stampButtonsHTML(null, id) +
      '<div class="cmsg" role="status"></div>' +
      '</div>';
  }

  /* 카드/시트에 넣을 후기 블록 */
  function sectionHTML(itemId, title) {
    if (!enabled()) return '';
    return '<div class="cbox" data-cm="' + esc(itemId) + '">' +
      (title ? '<div class="ctitle">' + esc(title) + '</div>' : '') +
      '<div class="cbody">' + (loadedAt ? listHTML(itemId) : '<div class="cempty">후기를 불러오는 중…</div>') + '</div>' +
      formHTML(itemId) + '</div>';
  }

  function refreshCounts() {
    var els = document.querySelectorAll('.cbtn');
    for (var i = 0; i < els.length; i++) {
      var id = els[i].getAttribute('data-cm'), n = count(id);
      var tag = els[i].querySelector('.cn');
      if (tag) tag.textContent = n;
      els[i].setAttribute('aria-label', '후기 ' + n + '개 보기');
      if (n) els[i].classList.add('has'); else els[i].classList.remove('has');
    }
    if (typeof window !== 'undefined' && typeof window.__ungcCountHook === 'function') {
      try { window.__ungcCountHook(); } catch (e) {}
    }
  }


  /* 인라인 수정 입력창 */
  function startEdit(box, cid) {
    var li = box.querySelector('li[data-cid="' + cid + '"]');
    if (!li || li.querySelector('.ceditbox')) return;
    var arr = list(box.getAttribute('data-cm')), cur = '';
    for (var i = 0; i < arr.length; i++) if (arr[i].id === String(cid)) cur = arr[i].t;
    var tt = li.querySelector('.ctt'), ed = li.querySelector('.cedit');
    if (tt) tt.style.display = 'none';
    if (ed) ed.style.display = 'none';
    var box2 = document.createElement('div'), pz = parseTags(cur);
    box2.className = 'ceditbox';
    box2.innerHTML = stampButtonsHTML(pz.tags, box.getAttribute('data-cid')) +
      '<div class="cetop"><input type="text" maxlength="' + MAXT + '" value="' + esc(pz.body) + '" aria-label="후기 수정">' +
      '<button type="button" class="save" data-cs="' + esc(cid) + '">저장</button>' +
      '<button type="button" data-cc="1">취소</button></div>';
    li.appendChild(box2);
    var inp = box2.querySelector('input');
    if (inp) {
      inp.focus();
      try { inp.setSelectionRange(inp.value.length, inp.value.length); } catch (e) {}
      inp.addEventListener('keydown', function (ev) {
        if (ev.key === 'Enter' && !ev.isComposing) { ev.preventDefault(); saveEdit(box, box2.querySelector('[data-cs]')); }
        else if (ev.key === 'Escape') { ev.preventDefault(); repaint(box); }
      });
    }
  }

  function saveEdit(box, btn) {
    var cid = btn.getAttribute('data-cs');
    var li = box.querySelector('li[data-cid="' + cid + '"]');
    var inp = li ? li.querySelector('.ceditbox input') : null;
    if (!inp) return;
    var v = (inp.value || '').replace(/\s+/g, ' ').trim();
    var st = readStamps(li);
    if (!v && !st.length) { inp.focus(); return; }
    v = compose(v, st);
    if (!v) { inp.focus(); return; }
    btn.disabled = true; btn.textContent = '저장 중…';
    editComment(box.getAttribute('data-cm'), cid, v, function (ok) {
      if (ok) { repaint(box); return; }
      btn.disabled = false; btn.textContent = '저장';
      var m = li.querySelector('.cmsg2');
      if (!m) { m = document.createElement('div'); m.className = 'cmsg2'; li.appendChild(m); }
      m.textContent = '수정하지 못했어요. 잠시 뒤 다시 시도해 주세요.';
    });
  }

  function askDelete(box, cid) {
    var arr = list(box.getAttribute('data-cm')), cur = '';
    for (var i = 0; i < arr.length; i++) if (arr[i].id === String(cid)) cur = arr[i].t;
    var q = '이 후기를 삭제할까요?' + (cur ? '\n\n“' + cur + '”' : '');
    var yes = true;
    try { yes = window.confirm(q); } catch (e) { yes = true; }
    if (!yes) return;
    deleteComment(box.getAttribute('data-cm'), cid, function (ok) {
      if (ok) { repaint(box); return; }
      var li = box.querySelector('li[data-cid="' + cid + '"]');
      if (!li) return;
      var m = li.querySelector('.cmsg2');
      if (!m) { m = document.createElement('div'); m.className = 'cmsg2'; li.appendChild(m); }
      m.textContent = '삭제하지 못했어요. 잠시 후 다시 시도해 주세요.';
    });
  }

  function repaint(box) {
    var id = box.getAttribute('data-cm');
    var body = box.querySelector('.cbody');
    if (body) body.innerHTML = loadedAt ? listHTML(id) : '<div class="cempty">후기를 불러오는 중…</div>';
    refreshCounts();
  }

  function bind(box) {
    if (!box || box.getAttribute('data-bound')) return;
    box.setAttribute('data-bound', '1');
    var id = box.getAttribute('data-cm');
    var nick = box.querySelector('.cnick');
    var text = box.querySelector('.ctext');
    var btn = box.querySelector('.csubmit');
    var msg = box.querySelector('.cmsg');
    var busy = false;
    try {
      var saved = localStorage.getItem('ungshong.nick');
      if (saved && nick && !nick.value) nick.value = saved;
    } catch (e) {}

    function say(t, kind) {
      if (!msg) return;
      msg.textContent = t || '';
      msg.className = 'cmsg' + (kind ? ' ' + kind : '');
    }
    function submit() {
      if (busy || !text) return;
      var nv = (nick && nick.value || '').replace(/\s+/g, ' ').trim().slice(0, MAXN) || '익명';
      var tv = (text.value || '').replace(/\s+/g, ' ').trim();
      var fwrap = box.querySelector('.cform') || box;   /* 작성 폼 안 태그만 (목록 수정창 태그와 섞지 않는다) */
      var st = readStamps(fwrap);
      if (!tv && !st.length) { say('후기를 한 줄 적어 주세요.', 'err'); text.focus(); return; }
      tv = compose(tv, st).slice(0, MAXT);
      busy = true; btn.disabled = true; btn.textContent = '저장 중…';
      try { localStorage.setItem('ungshong.nick', nv); } catch (e) {}
      add(id, nv, tv, function (ok) {
        busy = false; btn.disabled = false; btn.textContent = '등록';
        if (ok) {
          text.value = ''; resetStamps(fwrap); say('후기가 등록됐어요. 고마워요!', 'ok');
          repaint(box);
        } else {
          say('저장하지 못했어요. 잠시 뒤 다시 눌러 주세요.', 'err');
        }
      });
    }
    /* 목록 안 수정·삭제 (목록은 innerHTML로 다시 그려지므로 위임 처리) */
    box.addEventListener('click', function (ev) {
      var el = ev.target;
      var ce = el.closest ? el.closest('[data-ce]') : null;
      var cd = el.closest ? el.closest('[data-cd]') : null;
      var cs = el.closest ? el.closest('[data-cs]') : null;
      var cc = el.closest ? el.closest('[data-cc]') : null;
      var st = el.closest ? el.closest('.stamp') : null;
      if (st) { ev.preventDefault(); toggleStamp(st); return; }
      if (ce) { ev.preventDefault(); startEdit(box, ce.getAttribute('data-ce')); return; }
      if (cd) { ev.preventDefault(); askDelete(box, cd.getAttribute('data-cd')); return; }
      if (cs) { ev.preventDefault(); saveEdit(box, cs); return; }
      if (cc) { ev.preventDefault(); repaint(box); return; }
    });
    if (btn) btn.addEventListener('click', submit);
    if (text) text.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter' && !ev.isComposing) { ev.preventDefault(); submit(); }
    });

    repaint(box);
    if (!loadedAt) load(function () { repaint(box); });
  }

  function hydrate(root) {
    if (!root || !root.querySelectorAll) return;
    var boxes = root.querySelectorAll('.cbox');
    for (var i = 0; i < boxes.length; i++) bind(boxes[i]);
    refreshCounts();
  }

  /* 토큰 해시는 미리 계산 (수정·삭제 버튼 노출 판단용) */
  try { ensureHash(); } catch (e) {}

  return {
    enabled: enabled, load: load, hydrate: hydrate, add: add,
    edit: editComment, del: deleteComment, token: getToken, hash: function () { return MY_HASH; },
    ensureHash: ensureHash, _sha: sha256hex,
    list: list, count: count, esc: esc, placeId: placeId, idFor: idFor,
    sectionHTML: sectionHTML, listHTML: listHTML, formHTML: formHTML,
    refreshCounts: refreshCounts, fmtDate: fmtDate, loaded: function () { return !!loadedAt; },
    parseTags: parseTags, compose: compose, badges: badges, stampButtonsHTML: stampButtonsHTML,
    toggleStamp: toggleStamp, readStamps: readStamps, resetStamps: resetStamps, STAMPS: STAMPS,
    pol: polOf, tagLabel: tagLabel,
    _MAX: { n: MAXN, t: MAXT }
  };
})();
</script>
<script>

  var LS = {

  function placeHasAll(p, sec, toks){

    for (var i = 0; i < toks.length; i++) { if (hay.indexOf(toks[i]) < 0) return false; }

  /* ---------- 광역 지역 필터 (전국 맛지도) ---------- */

  /* 대표음식 카테고리 칩 — 📍 가볼 곳 2번째 줄. 지역 칩·조건 칩과 AND로 함께 걸린다 */

  /* 지역 머리말의 시·도 접두를 먼저 본다 — '경기 광주'(경기도 광주시)와 '광주 동구'(광주광역시)를 섞지 않는다 */
  var SIDO_RE = [
    ['seoul',        /^서울/],

    ['gjjeolla',     /^광주/],

  /* '서울 강남·선릉 · 맛집' → '서울', '성남시 분당구 구미로 124' → '성남시' */
  function regionHead(p){
    var seg = String(p.region || '').split(' · ')[0];
    seg = seg.split('·')[0].replace(/^\s+|\s+$/g, '');
    return seg.split(/\s+/)[0] || '';
  }
  function regionKey(p){
    var r = String(p.region || '');
    var head = regionHead(p);
    if (!head) return 'etc';
    var i;
    for (i = 0; i < SIDO_RE.length; i++) { if (SIDO_RE[i][1].test(head)) return SIDO_RE[i][0]; }

    for (i = 0; i < SIDO_RE.length; i++) { if (SIDO_RE[i][1].test(r)) return SIDO_RE[i][0]; }

  /* place._lb(대표메뉴 라벨) → 대표음식 카테고리. '데이트·체험'처럼 음식이 아닌 라벨은 어느 칩에도 넣지 않는다 */

  function copyText(t, okMsg){

        var ta = document.createElement('textarea');

        ta.style.position = 'fixed'; ta.style.opacity = '0'; ta.style.top = '0';
        document.body.appendChild(ta);
        ta.select(); ta.setSelectionRange(0, ta.value.length);
        var done = document.execCommand('copy');
        document.body.removeChild(ta);
        if (done) ok(); else toast('복사가 안 됐어요. 길게 눌러 복사해 주세요.');
      }catch(e){ toast('복사가 안 됐어요. 길게 눌러 복사해 주세요.'); }

    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(t).then(ok, fallback);

    if (!wakeSupported()) { toast('이 브라우저는 화면 꺼짐 방지를 지원하지 않아요'); return; }
    navigator.wakeLock.request('screen').then(function(s){
      WAKE.sentinel = s; WAKE.on = true; wakePaint();
      s.addEventListener('release', function(){ WAKE.sentinel = null; WAKE.on = false; wakePaint(); });
      toast('요리하는 동안 화면이 꺼지지 않아요');
    }, function(){

  function parseBackup(txt){
    txt = String(txt || '').trim();

      return JSON.parse(txt);

  function applyBackup(o){
    if (!o || typeof o !== 'object') return 0;
    var added = 0;
    function mergeMarks(src){
      for (var k in src) {
        if (!src.hasOwnProperty(k)) continue;
        var s = src[k] || {}, tgt = MARKS[k] || (MARKS[k] = {});
        if (s.f && !tgt.f) { tgt.f = 1; added++; }
        if (s.d && !tgt.d) { tgt.d = 1; added++; }
        if (!tgt.f && !tgt.d) delete MARKS[k];
      }
    }
    function mergeMap(src, tgt){
      for (var k in src) {
        if (!src.hasOwnProperty(k)) continue;
        var v = src[k];
        if (v && typeof v === 'object') {
          if (!tgt[k]) { tgt[k] = JSON.parse(JSON.stringify(v)); added++; }
          else { for (var i in v) { if (v.hasOwnProperty(i) && !tgt[k][i]) { tgt[k][i] = v[i]; added++; } } }
        } else if (!tgt[k]) { tgt[k] = v; added++; }
      }
    }
    if (o.marks) mergeMarks(o.marks);
    if (o.favs) mergeMap(o.favs, FAVS);
    if (o.ing) mergeMap(o.ing, INGCHK);
    LS.set('ungshong_place_marks', MARKS);
    LS.set('ungshong_recipe_favs', FAVS);
    LS.set('ungshong_ing_checks', INGCHK);
    return added;
  }

    ['샐러드·포케', /샐러드|포케|비건|채식/],
    ['쌈밥·쌈', /쌈밥|쌈/],
    ['한식·백반', /백반|한정식|정식|찌개|탕|한식|솥밥|비빔밥|볶음밥|불고기|나물|보리밥|국수/],
    ['무한리필·뷔페', /무한리필|뷔페|부페/]
  ];
  var ACT_SECT = /데이트|체험|소품샵|여행|숙소/;

  function sectLabel(sect){
    sect = sect || '';
    if(sect.indexOf('소품샵') >= 0) return '소품·편집숍';
    if(sect.indexOf('여행') >= 0 || sect.indexOf('숙소') >= 0) return '여행·숙소';
    if(sect.indexOf('데이트') >= 0 || sect.indexOf('체험') >= 0) return '데이트·체험';
    if(sect.indexOf('카페') >= 0) return '카페';
    if(sect.indexOf('술집') >= 0) return '술집·안주';
    return '';
  }
  function menuLabel(p, sect){
    if(ACT_SECT.test(sect || '')) return sectLabel(sect);
    var t = String(p.name || '') + ' ' + String(p.desc || '');
    t = t.replace(/탕수육/g, ' ');   /* '수육' 오탐 방지 */
    for(var i=0;i<DISH.length;i++){ if(DISH[i][1].test(t)) return DISH[i][0]; }
    return sectLabel(sect);
  }
  /* 지역 표기 끝의 '· 맛집' 같은 카테고리 중복은 화면에서만 뺀다(데이터는 그대로) */
  function regionText(r){
    return String(r == null ? '' : r).replace(/\s*·\s*(맛집|카페|술집|체험|데이트|여행|숙소|소품샵)\s*$/, '').trim();
  }
  PL.forEach(function(sec){
    if(sec.k !== 'place') return;
    sec.p.forEach(function(p){ p._lb = menuLabel(p, sec.t); });
  });

  /* ---------------- 이미지 지연 로딩 ---------------- */
  var io = null;
  if('IntersectionObserver' in window){
    io = new IntersectionObserver(function(ents){
      ents.forEach(function(en){
        if(!en.isIntersecting) return;
        var im = en.target; io.unobserve(im);
        var n = im.getAttribute('data-n');
        if(n) im.src = imgSrc(n);
      });
    }, {rootMargin:'500px 0px'});
  }
  function attach(img){
    img.loading = 'lazy';
    img.addEventListener('load', function(){ img.classList.add('on'); });
    img.addEventListener('error', function(){ img.classList.remove('on'); img.style.visibility = 'hidden'; });
    if(io) io.observe(img);
    else img.src = imgSrc(img.getAttribute('data-n'));
  }

  var grid = document.getElementById('grid');
  var empty = document.getElementById('empty');
  var cnt = document.getElementById('cnt');

  /* ---------- 🧊 냉장고 털기 재료 칩 (다중 선택 AND) ----------
     각 레시피의 ing·t·x 텍스트에서 키워드를 찾는다. 한국 요리 표기(계란/달걀, 목살/삼겹살 …)도 함께 잡는다. */
  var INGCHIPS = [
    { k:'egg',     t:'🥚 계란',      re:/계란|달걀/ },
    { k:'tofu',    t:'🧊 두부',      re:/두부/ },
    { k:'cabbage', t:'🥬 양배추',    re:/양배추/ },
    { k:'pork',    t:'🐷 돼지고기',  re:/돼지고기|목살|삼겹살|대패|앞다리|다짐육/ },
    { k:'chicken', t:'🍗 닭',        re:/닭/ },
    { k:'tuna',    t:'🐟 참치',      re:/참치/ },
    { k:'kimchi',  t:'🌶️ 김치',      re:/김치/ },
    { k:'cheese',  t:'🧀 치즈',      re:/치즈/ }
  ];
  var INGBY = {};
  INGCHIPS.forEach(function(c){ INGBY[c.k] = c; });

  function ingHay(e){
    if(e._ih == null){
      e._ih = [e.t || '', e.ing || '',
        (e.x || []).map(function(x){ return (x.l || '') + ' ' + (x.v || ''); }).join(' ')].join(' ');
    }
    return e._ih;
  }
  function ingHit(e, k){ var c = INGBY[k]; return c ? c.re.test(ingHay(e)) : true; }
  function ingOn(){ return state.ings.length > 0; }
  function ingHas(k){ return state.ings.indexOf(k) >= 0; }
  function ingMatch(e){
    for(var i = 0; i < state.ings.length; i++){ if(!ingHit(e, state.ings[i])) return false; }
    return true;
  }

  /* ---------- ⚡ 초간단 (재료 5개 이하) · 정리 상태 (다중 선택 AND) ---------- */
  var STATOPTS = [
    { k:'quick',     t:'⚡ 초간단' },
    { k:'appliance', t:'🔌 렌지·에프' },
    { k:'reviewed',  t:'💬 후기' }
  ];
  function recipeHasPol(e, pol){
    var arr = UNGC.list('r_' + e.n);
    if(!arr || !arr.length) return false;
    for(var i = 0; i < arr.length; i++){
      var tags = UNGC.parseTags((arr[i] && arr[i].t) || '').tags;
      for(var j = 0; j < tags.length; j++){
        if(UNGC.pol(tags[j]) === pol) return true;
      }
    }
    return false;
  }
  function isAppliance(e){ return /(전자레인지|전자렌지|에어프라이어|에어프라이기|렌지|에프|오븐없이|노오븐)/.test(e._s); }
  function statOn(){ return state.stats.length > 0; }
  function statHas(k){ return state.stats.indexOf(k) >= 0; }
  function statMatch(e){
    for(var i = 0; i < state.stats.length; i++){
      var k = state.stats[i];
      if(k === 'quick'){ if(!(e.ic <= 5)) return false; }
      else if(k === 'appliance'){ if(!isAppliance(e)) return false; }
      else if(k === 'reviewed'){ if(!(UNGC.count('r_' + e.n) > 0)) return false; }
      else if(k === 'pos'){ if(!recipeHasPol(e, 'pos')) return false; }
      else if(k === 'neg'){ if(!recipeHasPol(e, 'neg')) return false; }
    }
    return true;
  }

  /* 재료 조건을 뺀 나머지 조건(카테고리·검색어·상태·찜) — 재료 칩 건수 계산에도 쓴다 */
  function baseMatch(e){
    if(state.cat !== 'all' && e.c !== state.cat) return false;
    if(!statMatch(e)) return false;
    if(state.fav && !isFav(e.n)) return false;
    var toks = qTokens();
    for(var i=0;i<toks.length;i++){ if(e._s.indexOf(toks[i]) < 0) return false; }
    return true;
  }

  function filtered(){ return D.filter(function(e){ return baseMatch(e) && ingMatch(e); }); }

  /* 🧊 재료 칩 줄 — 다른 조건(카테고리·초간단·찜·검색어)에 맞는 레시피에서 건수를 세고, 0건이면 숨긴다 */
  var iceEl = document.getElementById('rcchips');
  function ingCount(k){
    var n = 0;
    for(var j = 0; j < D.length; j++){
      var e = D[j];
      if(!baseMatch(e)) continue;
      if(!ingHit(e, k)) continue;
      var ok = true;
      for(var i = 0; i < state.ings.length; i++){
        var o = state.ings[i];
        if(o !== k && !ingHit(e, o)){ ok = false; break; }
      }
      if(ok) n++;
    }
    return n;
  }
  var iceBtn = document.getElementById('icebtn');
  function updateIceBtn(){
    if(!iceBtn) return;
    iceBtn.hidden = (state.view !== 'recipe');
    var n = state.ings.length;
    iceBtn.className = 'icebtn' + ((state.iceOpen || n > 0) ? ' on' : '');
    iceBtn.setAttribute('aria-expanded', state.iceOpen ? 'true' : 'false');
    iceBtn.textContent = '🧊 냉장고' + (n ? ' (' + n + ')' : '') + (state.iceOpen ? ' ▴' : ' ▾');
  }
  if(iceBtn){
    iceBtn.addEventListener('click', function(){
      state.iceOpen = !state.iceOpen;
      updateIceBtn();
      renderIceChips();
    });
  }
  function renderIceChips(){
    if(!iceEl) return;
    iceEl.hidden = (state.view !== 'recipe');
    if(iceEl.hidden) return;
    var html = '<span class="clab" aria-hidden="true">🧊 냉장고</span>' +
      '<button class="chip' + (!ingOn() ? ' on' : '') + '" type="button" data-ic="all" aria-pressed="' +
        (ingOn() ? 'false' : 'true') + '">전체</button>';
    INGCHIPS.forEach(function(c){
      var n = ingCount(c.k), on = ingHas(c.k);
      if(!n && !on) return;                        /* 0건 칩은 숨김 (켜 둔 칩은 남겨 해제할 수 있게) */
      html += '<button class="chip area' + (on ? ' on' : '') + '" type="button" data-ic="' + c.k +
        '" aria-pressed="' + (on ? 'true' : 'false') + '">' + c.t + '<span class="c">' + n + '</span></button>';
    });
    iceEl.innerHTML = html;
    iceEl.hidden = false;
  }
  if(iceEl) iceEl.addEventListener('click', function(ev){
    var b = ev.target.closest('.chip'); if(!b) return;
    var k = b.getAttribute('data-ic');
    if(k === 'all'){ state.ings = []; }
    else {
      var i = state.ings.indexOf(k);
      if(i >= 0) state.ings.splice(i, 1); else state.ings.push(k);
    }
    renderIceChips(); renderGrid();
  });

  /* 카드 썸네일 💬 후기 배지 — 후기를 불러온 뒤 숫자를 채운다 */
  function refreshRcm(){
    if(!UNGC.enabled()) return;
    if(state.view === 'recipe') renderStat();
    var els = document.querySelectorAll('.rcmb');
    for(var i = 0; i < els.length; i++){
      var n = UNGC.count(els[i].getAttribute('data-rcm'));
      els[i].textContent = '💬 ' + n;
      els[i].classList.toggle('has', n > 0);
    }
    var hc = document.getElementById('rcmh');
    if(hc) hc.textContent = UNGC.count('r_' + sheetN) + '개';
    if(state.view === 'recipe') renderStat();
  }

  var UNIT = '(?:g|kg|ml|mL|L|개|공기|컵|스푼|큰술|작은술|T|t|장|대|쪽|알|모|봉|캔|팩|줌|꼬집|인분|분|시간|cm|%|kcal)';
  function bare(s){
    s = s.replace(/\*\*/g,'').replace(/\(.*?\)/g,'').trim();
    s = s.replace(new RegExp('\\s*\\d[\\d\\/\\~\\.\\-]*\\s*' + UNIT + '?$'), '').trim();
    return s;
  }
  function preview(e){
    var src = e.ing;
    if(!src && e.x.length) src = e.x[0].v;
    if(!src) return '';
    var parts = src.split(/[,\/\n]/).map(function(s){ return bare(s.replace(/^\*\*[^*]+\*\*\s*:\s*/, '')); }).filter(Boolean);
    var show = [];
    for(var i=0;i<parts.length && show.length<3;i++){ if(show.indexOf(parts[i])<0) show.push(parts[i]); }
    return show.join('·');
  }

  function renderGrid(){
    var list = filtered();
    var frag = document.createDocumentFragment();
    list.forEach(function(e){
      var f = isFav(e.n);
      var card = document.createElement('article');
      card.className = 'card';
      card.setAttribute('data-n', e.n);
      card.innerHTML = '<div class="thumb"><img data-n="'+e.n+'" alt="'+esc(e.t)+'" loading="lazy" decoding="async">'+
        (e.v ? '<span class="badge"><i>▶</i>영상</span>' : '')+
        '<button class="favbtn'+(f?' on':'')+'" type="button" data-fav="'+e.n+'" aria-pressed="'+(f?'true':'false')+'" aria-label="'+(f?'찜 해제':'찜하기')+'">'+(f?'♥':'♡')+'</button>'+
        '<span class="rcmb" data-rcm="r_'+e.n+'" aria-hidden="true"></span></div>'+
        '<div class="cb"><div class="ct">'+esc(e.t)+'</div>'+
        '<div class="cm">'+(e.ic?'<b>재료 '+e.ic+'</b> · ':'')+esc(preview(e))+'</div></div>';
      frag.appendChild(card);
    });
    grid.innerHTML = '';
    grid.appendChild(frag);
    Array.prototype.forEach.call(grid.querySelectorAll('img'), attach);
    empty.innerHTML = EMPTY_RECIPE;
    empty.classList.toggle('on', list.length === 0);
    cnt.innerHTML = '<b>'+list.length+'</b>개'+(list.length!==D.length?' / '+D.length:'');
    renderFavPill();
    renderIceChips();
    refreshRcm();
  }

  // category chips
  var catsEl = document.getElementById('cats');
  function renderCats(){
    var counts = {}; D.forEach(function(e){ counts[e.c] = (counts[e.c]||0)+1; });
    var html = '<button class="chip'+(state.cat==='all'?' on':'')+'" data-c="all">전체<span class="c">'+D.length+'</span></button>';
    CATS.forEach(function(c){
      html += '<button class="chip'+(state.cat===c?' on':'')+'" data-c="'+esc(c)+'">'+esc(c)+'<span class="c">'+counts[c]+'</span></button>';
    });
    catsEl.innerHTML = html;
  }
  catsEl.addEventListener('click', function(ev){
    var b = ev.target.closest('.chip'); if(!b) return;
    state.cat = b.getAttribute('data-c');
    renderCats(); renderGrid();
  });

  // 레시피 찜 필터
  var favPill = document.getElementById('favpill');
  function renderFavPill(){
    favPill.classList.toggle('on', state.fav);
    favPill.setAttribute('aria-pressed', state.fav ? 'true' : 'false');
    document.getElementById('favn').textContent = favCount();
  }
  favPill.addEventListener('click', function(){
    state.fav = !state.fav;
    renderFavPill();
    renderGrid();
  });

  // status segment
  var statEl = document.getElementById('stat');
  var nVideo = D.filter(function(e){return e.v;}).length;
  var nQuick = D.filter(function(e){return e.ic <= 5;}).length;
  var nAppliance = D.filter(isAppliance).length;
  function renderStat(){
    var nRev = D.filter(function(e){return UNGC.count('r_' + e.n) > 0;}).length;
    var counts = { quick:nQuick, appliance:nAppliance, reviewed:nRev };
    var html = '<button data-s="all" class="'+(statOn()?'':'on')+'" aria-pressed="'+(statOn()?'false':'true')+'">전체</button>';
    STATOPTS.forEach(function(o){
      var on = statHas(o.k);
      html += '<button data-s="'+o.k+'" class="'+(on?'on':'')+'" aria-pressed="'+(on?'true':'false')+'">'+
        o.t+' <span class="n">'+counts[o.k]+'</span></button>';
    });
    statEl.innerHTML = html;
  }
  statEl.addEventListener('click', function(ev){
    var b = ev.target.closest('button'); if(!b) return;
    var k = b.getAttribute('data-s');
    if(k === 'all'){ state.stats = []; }                 /* 전체: 켜진 상태 조건을 끈다 */
    else {
      state.stats = (state.stats[0] === k) ? [] : [k];   /* 한 번에 하나만 선택 */
    }
    renderStat(); renderGrid();
  });

  // search
  var q = document.getElementById('q'), qx = document.getElementById('qx');
  var timer = null;
  q.addEventListener('input', function(){
    qx.classList.toggle('on', !!q.value);
    clearTimeout(timer);
    timer = setTimeout(function(){
      var wasSearch = !!norm(state.q);
      state.q = q.value.trim();
      // 검색어를 지우면 카테고리는 다시 모두 접힌 상태로 돌아간다
      if(wasSearch && !norm(state.q) && (state.region || 'all') === 'all') SECOPEN = {};
      if(state.view === 'recipe') renderGrid();
      else if(state.view === 'comment') renderCmFeed();
      else renderPlaces();
    }, 90);
  });
  qx.addEventListener('click', function(){
    q.value = ''; qx.classList.remove('on'); state.q = ''; SECOPEN = {};
    if(state.view === 'recipe') renderGrid();
    else if(state.view === 'comment') renderCmFeed();
    else renderPlaces();
    q.focus();
  });

  // ---------- places ----------
  var placesEl = document.getElementById('places');
  var PL_N = 0, PL_LIST = 0;
  PL.forEach(function(s){ if(s.k === 'place') PL_N += s.p.length; else if(s.k === 'list') PL_LIST += s.p.length; });
  var EMPTY_RECIPE = empty.innerHTML;
  var EMPTY_PLACE = '<div class="e">📍</div><div class="t">찾는 장소가 없어요</div>'+
    '<div class="s">동네나 가게 이름을 다르게 적어 보세요.<br>예: ‘연남’, ‘카페’, ‘국밥’</div>';

  /* 원터치 필터 칩 — region·desc·name 글자와 m(주차·애견) 값으로 매칭한다.
     동네 칩은 지역 표기가 '서울 성동·성수', '성수이로 118'처럼 제각각이라 키워드로 묶었다. */
  var PCHIPS = [
    {k:'all',      t:'전체'},
    {k:'open',     t:'🟢 영업중'},
    {k:'fav',      t:'♡ 찜',        mk:'f'},
    {k:'done',     t:'✓ 다녀옴',    mk:'d'},
    {k:'pk',       t:'주차가능'},
    {k:'pet',      t:'애견동반'}
  ];
  var CHIPBY = {};
  PCHIPS.forEach(function(c){ CHIPBY[c.k] = c; });

  /* 원터치 칩은 다중 선택(AND) — state.pcs 에 켜진 키가 들어 있고, 비어 있으면 '전체' 상태다. */
  function pcsOn(){ return !!(state.pcs && state.pcs.length > 0); }
  function pcsHas(k){ return !!(state.pcs && state.pcs.indexOf(k) >= 0); }

  function placeText(p){
    return (p.name || '') + ' ' + (p.region || '') + ' ' + (p.desc || '');
  }
  function commentCount(p){
    if(!UNGC.enabled()) return 0;
    return UNGC.count(UNGC.placeId(p.name, p.region));
  }

  /* 모든 장소 후기를 합친 총 후기 수 — 하단 줄 💬 후기 pill 숫자
     🙋‍♀️ 추가·수정 요청(item_id '__req__')은 후기가 아니므로 합산에서 뺀다. */
  function commentAllCount(){
    if(!UNGC.enabled()) return 0;
    var n = 0;
    PL.forEach(function(sec){
      if(sec.k === 'folder') return;
      sec.p.forEach(function(p){
        var id = UNGC.placeId(p.name, p.region);
        if(id === REQ_ID) return;              /* 요청함은 후기 수에서 제외 */
        if(id.indexOf('r_') === 0) return;     /* 레시피 한줄 후기는 가볼 곳 후기가 아니다 */
        n += UNGC.count(id);
      });
    });
    return n;
  }

  function placeMatch(p, ck){
    if(!ck || ck === 'all') return true;
    var m = p.m || {};
    if(ck === 'fav') return !!markOf(p).f;
    if(ck === 'done') return !!markOf(p).d;
    if(ck === 'comment') return commentCount(p) > 0;
    if(ck === 'open') return isOpenNow(p);
    if(ck === 'pk'){
      if(m.pk === 1) return true;
      if(m.pk === 0) return false;
      // 주차 값이 없을 때만 문구로 보조 판정 (인근 유료주차 같은 표현은 제외)
      return /주차\s*가능|주차장\s*있|매장\s*앞\s*주차|전용\s*주차/.test(placeText(p));
    }
    if(ck === 'pet'){
      if(m.dg === 1) return true;
      if(m.dg === 0) return false;
      return /애견\s*동반|애견\s*가능|반려동물\s*동반|반려견\s*동반|댕댕이?\s*동반/.test(placeText(p));
    }
    var c = CHIPBY[ck];
    if(!c || !c.keys) return true;
    var t = placeText(p);
    for(var i=0;i<c.keys.length;i++){ if(t.indexOf(c.keys[i]) >= 0) return true; }
    return false;
  }

  /* 켜진 원터치 칩을 모두 만족하는 곳만 남긴다(AND). 켜진 칩이 없으면 전부 통과. */
  function pchipsMatch(p){
    var a = state.pcs || [];
    for(var i = 0; i < a.length; i++){ if(!placeMatch(p, a[i])) return false; }
    return true;
  }

  /* ---------- 🟢 영업중: 영업시간 문자열(m.h) 해석 ----------
     표기 예) '11:00~21:00' · '24시간' · '월 휴무, 화~일 11:30~21:00'
              '월·수·목 17:00~02:00, 금·토 17:00~03:00' · '15:00~24:00 (토·일 13:00~23:00)'
     요일별 영업 구간으로 바꾼 뒤 지금(KST) 열었는지 본다. 브레이크·라스트오더는 제외,
     해석할 수 없는 표기(미등록·확인필요 포함)는 '영업중'에서 뺀다. */
  var HD = '일월화수목금토';                 /* 일=0 … 토=6 */
  function hAllDays(){ return [0,1,2,3,4,5,6]; }
  function hDaySet(spec){
    var s = String(spec || '');
    if(/매일|연중무휴/.test(s)) return hAllDays();
    if(/평일/.test(s)) return [1,2,3,4,5];
    if(/주말/.test(s)) return [0,6];
    var out = [], m, re = /([일월화수목금토])\s*~\s*([일월화수목금토])/g;
    while((m = re.exec(s))){
      var a = HD.indexOf(m[1]), b = HD.indexOf(m[2]), k = a, guard = 0;
      while(a >= 0 && b >= 0){
        if(out.indexOf(k) < 0) out.push(k);
        if(k === b || ++guard > 7) break;
        k = (k + 1) % 7;
      }
    }
    s = s.replace(/([일월화수목금토])\s*~\s*([일월화수목금토])/g, ' ');
    for(var i = 0; i < s.length; i++){
      var d = HD.indexOf(s.charAt(i));
      if(d >= 0 && out.indexOf(d) < 0) out.push(d);
    }
    return out.length ? out : null;
  }
  function hParse(h){
    var s = String(h == null ? '' : h).replace(/\s+/g, ' ').trim();
    if(!s) return null;
    var days = [null,null,null,null,null,null,null], parents = [], any = false;
    var main = s.replace(/\(([^)]*)\)/g, function(_, inner){ parents.push(inner); return ' '; });
    function apply(cl, override){
      cl = String(cl || '').replace(/\s+/g, ' ').trim();
      if(!cl) return;
      if(/브레이크|라스트/.test(cl)) return;          /* 쉬는 구간은 영업 판정에서 뺀다 */
      var tm = cl.match(/(\d{1,2}):(\d{2})\s*~\s*(\d{1,2}):(\d{2})/);
      if(/24\s*시간/.test(cl) && !tm){
        var ds0 = hDaySet(cl.replace(/24\s*시간/g, ' ')) || hAllDays();
        for(var a0 = 0; a0 < ds0.length; a0++){ days[ds0[a0]] = [[0, 1440]]; any = true; }
        return;
      }
      if(/휴무/.test(cl)){
        var ds1 = hDaySet(cl.replace(/휴무/g, ' ')) || hAllDays();
        for(var a1 = 0; a1 < ds1.length; a1++){ days[ds1[a1]] = []; any = true; }
        return;
      }
      if(!tm) return;
      var st = (+tm[1]) * 60 + (+tm[2]), en = (+tm[3]) * 60 + (+tm[4]);
      var ds2 = hDaySet(cl.replace(tm[0], ' ')) || hAllDays();
      for(var a2 = 0; a2 < ds2.length; a2++){
        var d = ds2[a2];
        if(override || days[d] === null) days[d] = [[st, en]];
        else days[d] = days[d].concat([[st, en]]);   /* 브레이크로 나뉜 하루 두 구간 */
        any = true;
      }
    }
    var parts = main.split(',');
    for(var i = 0; i < parts.length; i++) apply(parts[i], false);
    for(var j = 0; j < parents.length; j++){          /* '(...)'는 그 요일만 덮어쓴다 */
      var sub = parents[j].split(',');
      for(var k = 0; k < sub.length; k++) apply(sub[k], true);
    }
    if(!any) return null;
    for(var z = 0; z < 7; z++) if(days[z] === null) days[z] = [];
    return days;
  }
  function hParseCached(p){
    var h = (p && p.m) ? String(p.m.h || '') : '';
    if(p && p._hk === h && p._hv !== undefined) return p._hv;
    var v = hParse(h);
    if(p){ p._hk = h; p._hv = v; }
    return v;
  }
  /* 한국 시각(Asia/Seoul) — 기기 시간대와 무관하게 UTC+9로 계산 */
  function kstNow(){
    var t = new Date(Date.now() + 9 * 3600000);    /* UTC+9 벽시계 → getUTC* 로 읽는다 */
    return { dow: t.getUTCDay(), min: t.getUTCHours() * 60 + t.getUTCMinutes() };
  }
  function hOpenAt(days, dow, min){
    if(!days) return false;
    var i, a, b, r = days[dow] || [];
    for(i = 0; i < r.length; i++){
      a = r[i][0]; b = r[i][1];
      if(b > a){ if(min >= a && min < b) return true; }
      else if(min >= a) return true;                  /* 17:00~02:00 처럼 자정 넘김 */
    }
    var y = days[(dow + 6) % 7] || [];                /* 어제 시작해 자정을 넘긴 구간 */
    for(i = 0; i < y.length; i++){
      a = y[i][0]; b = y[i][1];
      if(b <= a && min < b) return true;
    }
    return false;
  }
  function isOpenNow(p){ var n = kstNow(); return hOpenAt(hParseCached(p), n.dow, n.min); }

        var base = norm([p.name, p.region, p.desc, dish(p)].join(' '));
        for(var i = 0; i < arr.length; i++){
          var c = arr[i];
          if(!c || !c.t) continue;
          var ok = true;
          for(var k = 0; k < toks.length; k++){
            if((base + ' ' + norm([c.n, c.t].join(' '))).indexOf(toks[k]) < 0){ ok = false; break; }
          }
          if(!ok) continue;
          if(CMNICK && String(c.n || '익명') !== CMNICK) continue;
          out.push({kind:'place', p:p, c:c, id:id, ts:cmTs(c.d)});
        }
      });
    });
    D.forEach(function(e){
      var id = 'r_' + e.n;
      var arr = UNGC.list(id);
      if(!arr || !arr.length) return;
      var base = norm([e.t, e.c].join(' '));
      for(var i = 0; i < arr.length; i++){
        var c = arr[i];
        if(!c || !c.t) continue;
        var ok = true;
        for(var k = 0; k < toks.length; k++){
          if((base + ' ' + norm([c.n, c.t].join(' '))).indexOf(toks[k]) < 0){ ok = false; break; }
        }
        if(!ok) continue;
        if(CMNICK && String(c.n || '익명') !== CMNICK) continue;
        out.push({kind:'recipe', e:e, c:c, id:id, ts:cmTs(c.d)});
      }
    });
    out.sort(function(a, b){ return b.ts - a.ts; });   /* 최신순 */
    return out;
  }

  /* 🏆 후기왕 랭킹 — 닉네임별 후기 수 Top 3 (요청함 __req__ 제외) */
  function cmNickRank(){
    var map = {}, order = [];
    function addRank(id){
      var arr = UNGC.list(id);
      for(var i = 0; i < arr.length; i++){
        var c = arr[i];
        if(!c || !c.t) continue;
        var nk = String(c.n || '익명');
        if(map[nk] === undefined){ map[nk] = 0; order.push(nk); }
        map[nk]++;
      }
    }
    PL.forEach(function(sec){
      if(sec.k === 'folder') return;
      sec.p.forEach(function(p){
        var id = markId(p);
        if(id === REQ_ID || id.indexOf('r_') === 0) return;
        addRank(id);
      });
    });
    D.forEach(function(e){ addRank('r_' + e.n); });
    order.sort(function(a, b){ return (map[b] - map[a]) || (a < b ? -1 : a > b ? 1 : 0); });
    return order.map(function(nk){ return { n: nk, c: map[nk] }; });
  }

  /* 후기 태그 집계 — 긍정/비추 후기 수와 개별 태그별 건수 */
  function cmTagStats(items){
    var st = { total: items.length, place: 0, recipe: 0, pos: 0, neg: 0, mid: 0, dog: 0, park: 0, byTag: {} };
    for(var i = 0; i < items.length; i++){
      if(items[i].kind === 'recipe') st.recipe++; else st.place++;
      var tags = UNGC.parseTags(items[i].c.t).tags, hasP = false, hasN = false;
      for(var j = 0; j < tags.length; j++){
        var k = tags[j], pol = UNGC.pol(k);
        st.byTag[k] = (st.byTag[k] || 0) + 1;
        if(pol === 'pos') hasP = true;
        else if(pol === 'neg') hasN = true;
      }
      if(hasP) st.pos++;
      if(hasN) st.neg++;
      if(cmfTagHit(tags, CMFDOG)) st.dog++;
      if(cmfTagHit(tags, CMFPARK)) st.park++;
    }
    return st;
  }
  function cmFilterItems(items){
    var a = CMFILT.keys;
    if(!a.length) return items;
    var out = [];
    for(var i = 0; i < items.length; i++){
      var tags = UNGC.parseTags(items[i].c.t).tags, ok = true;
      for(var j = 0; j < a.length && ok; j++){
        var k = a[j];
        if(k === 'place'){ ok = (items[i].kind === 'place'); }
        else if(k === 'recipe'){ ok = (items[i].kind === 'recipe'); }
        else if(k === 'pos' || k === 'neg'){
          var hit = false;
          for(var t = 0; t < tags.length; t++){ if(UNGC.pol(tags[t]) === k){ hit = true; break; } }
          ok = hit;
        } else {
          ok = cmfTagHit(tags, (k === 'dog') ? CMFDOG : (k === 'park') ? CMFPARK : [k]);
        }
      }
      if(ok) out.push(items[i]);
    }
    return out;
  }
